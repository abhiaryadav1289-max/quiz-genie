<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Quiz Genie</title>
<style>
body{font-family:sans-serif;background:#0a0f1e;color:#fff;padding:20px}
textarea{width:100%;height:200px;margin-bottom:10px}
button{padding:10px;margin:5px;background:#00d4ff;border:none}
.option{display:block;width:100%;margin:5px 0;padding:10px;background:#222;color:#fff}
.correct{background:green}
.wrong{background:red}
</style>
</head><body><h2>Quiz Genie (Paste Questions)</h2><textarea id="pasteBox" placeholder="Paste 45 questions here..."></textarea><br>
<button onclick="generate()">Generate Quiz</button><h3 id="timer"></h3>
<div id="quiz"></div>
<div id="result"></div><script>

let questions=[], answers=[], current=0;
let time=1800, timerInt;

// 🔥 Parse
function parseQuiz(text){
  const blocks=text.trim().split(/\n\s*\n/);
  let qs=[];

  blocks.forEach(b=>{
    let l=b.split("\n");
    if(l.length>=6){
      qs.push({
        question:l[0].replace(/^Q\d+\.\s*/,""),
        options:l.slice(1,5),
        correct:l[5].replace(/Ans:\s*/i,"").trim()
      });
    }
  });

  return qs;
}

// 🚀 Generate
function generate(){
  let text=document.getElementById("pasteBox").value;
  questions=parseQuiz(text);
  answers=new Array(questions.length).fill(null);
  current=0;

  startTimer();
  showQ();
}

// ⏱ Timer
function startTimer(){
  clearInterval(timerInt);
  time=1800;
  timerInt=setInterval(()=>{
    time--;
    let m=Math.floor(time/60);
    let s=time%60;
    document.getElementById("timer").innerText=`Time: ${m}:${s}`;

    if(time<=0){
      clearInterval(timerInt);
      submit();
    }
  },1000);
}

// 📌 Show Q
function showQ(){
  let q=questions[current];
  let html=`<h3>Q${current+1}: ${q.question}</h3>`;

  q.options.forEach((opt,i)=>{
    let label=["A","B","C","D"][i];
    html+=`<button class="option" onclick="select('${label}')">${opt}</button>`;
  });

  html+=`<br><button onclick="next()">Next</button>`;
  document.getElementById("quiz").innerHTML=html;
}

// ✔️ Select
function select(a){
  answers[current]=a;
}

// ➡️ Next
function next(){
  current++;
  if(current<questions.length) showQ();
  else submit();
}

// 📊 Result
function submit(){
  clearInterval(timerInt);

  let score=0, c=0, w=0;
  questions.forEach((q,i)=>{
    if(answers[i]==q.correct){score+=4;c++;}
    else if(answers[i]){score-=1;w++;}
  });

  document.getElementById("result").innerHTML=
    `<h2>Score: ${score}</h2>
     <p>Correct: ${c}</p>
     <p>Wrong: ${w}</p>`;
}

</script></body>
</html>
