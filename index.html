<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie | Abhishek (Ydaabhi)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #4f46e5; --s: #10b981; --d: #ef4444; --bg: #f8fafc; --sur: #ffffff; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; color: #1e293b; }
        header { background: #1e1b4b; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; min-height: 70vh; }
        
        .admin-only { display: none; }
        .is-admin .admin-only { display: block; }

        .card { background: var(--sur); padding: 1.5rem; border-radius: 20px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        .q-img { max-width: 100%; border-radius: 12px; margin: 15px 0; border: 1px solid #eee; display: block; }
        
        /* Options */
        .option { padding: 1rem; border: 1.5px solid #e5e7eb; border-radius: 12px; margin-bottom: 0.8rem; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .option:hover { background: #f9fafb; border-color: var(--p); }
        .option.selected { background: #eef2ff; border-color: var(--p); color: var(--p); }
        .option.correct { background: #dcfce7; border-color: var(--s); color: #166534; }
        .option.wrong { background: #fee2e2; border-color: var(--d); color: #991b1b; }

        /* Palette */
        .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .dot { height: 40px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
        .dot.answered { background: var(--s); color: white; }
        .dot.active { border: 2px solid var(--p); color: var(--p); }

        .btn { padding: 0.8rem 1.2rem; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; width: 100%; }
        .btn-s { background: #f1f5f9; color: #1e293b; }
        
        /* About Section Design */
        .about-card { background: linear-gradient(135deg, #1e1b4b, #2e2a75); color: white; padding: 2rem; border-radius: 24px; text-align: center; margin-top: 3rem; }
        .social-links { display: flex; justify-content: center; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        .social-btn { padding: 8px 15px; background: rgba(255,255,255,0.1); border-radius: 10px; color: white; text-decoration: none; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.2); }
        
        .sol-frame { width: 100%; height: 450px; border: 1px solid #ddd; border-radius: 12px; margin-top: 15px; }
        textarea, input { width: 100%; padding: 0.8rem; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 10px; font-family: inherit; }

        footer { text-align: center; padding: 1.5rem; color: #64748b; font-size: 0.8rem; }
        #admin-trigger { cursor: pointer; opacity: 0.4; }
    </style>
</head>
<body id="main-body">

<header>
    <div class="logo" onclick="location.reload()" style="cursor:pointer; font-weight: 800;">NEET GENIE <span id="mode-text" style="font-weight:400; opacity:0.6">STUDENT</span></div>
    <div id="timer" style="display:none; font-family:monospace; font-size:1.2rem; background:rgba(255,255,255,0.1); padding:5px 10px; border-radius:8px">00:00</div>
</header>

<div class="container" id="v-dash">
    <div class="card admin-only" style="background: #1e1b4b; color: white;">
        <h3 style="margin:0">Admin Control</h3>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-s" onclick="exportData()">Backup File</button>
            <button class="btn btn-s" onclick="document.getElementById('f-in').click()">Import File</button>
            <input type="file" id="f-in" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <div class="card admin-only">
        <h3>Create Test</h3>
        <input type="text" id="t-name" placeholder="Test Name">
        <textarea id="t-qs" rows="4" placeholder="Q1. Text [IMG:url]... A) B) C) D)"></textarea>
        <textarea id="t-ans" rows="2" placeholder="Keys: 1 A | 2 C..."></textarea>
        <button class="btn btn-p" onclick="saveTest()">Publish</button>
    </div>

    <div id="test-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:1rem;"></div>
    
    <div class="about-card" id="about-dev">
        <h2 style="margin:0">Abhishek (Ydaabhi)</h2>
        <p style="opacity:0.8; font-style:italic; margin:10px 0;">"Success is not just about clearing an exam; it's about the discipline you build while trying."</p>
        <div class="social-links">
            <a href="https://t.me/Ydaabhi07" target="_blank" class="social-btn">Telegram: @Ydaabhi07</a>
            <a href="https://instagram.com/ydaabhi07" target="_blank" class="social-btn">Insta: @ydaabhi07</a>
        </div>
    </div>
</div>

<div class="container" id="v-quiz" style="display:none">
    <div style="display:grid; grid-template-columns: 1fr 300px; gap:20px;" id="quiz-stack">
        <div class="card">
            <div id="q-area"></div>
            <div style="display:flex; gap:10px; margin-top:2rem">
                <button class="btn btn-s" style="flex:1" onclick="move(-1)">Back</button>
                <button class="btn btn-s" style="flex:1" onclick="move(1)">Next</button>
                <button class="btn btn-p" id="sub-btn" style="flex:2" onclick="finish()">Submit</button>
            </div>
        </div>
        <div class="card">
            <h4>Navigator</h4>
            <div class="palette" id="palette"></div>
        </div>
    </div>
</div>

<div class="container" id="v-res" style="display:none"></div>

<footer>
    <p>© 2026 अभिषेक | <span id="admin-trigger" onclick="adminLogin()">Admin Login</span></p>
</footer>

<script>
    let db = JSON.parse(localStorage.getItem('genie_ultra_final')) || [];
    let state = { t: null, ans: {}, idx: 0, mode: 'exam' };

    function adminLogin() {
        const pass = prompt("Enter Admin Password:");
        if(pass === "Ydaabhi&189251") {
            document.getElementById('main-body').classList.add('is-admin');
            document.getElementById('mode-text').innerText = "ADMIN MODE";
        }
    }

    function saveTest() {
        const name = document.getElementById('t-name').value;
        const qRaw = document.getElementById('t-qs').value;
        const aRaw = document.getElementById('t-ans').value;
        const blocks = qRaw.split(/Q\d+\./).filter(b => b.trim());
        const qs = blocks.map((b, i) => {
            const lines = b.trim().split('\n').filter(l => l.trim());
            const imgMatch = lines[0].match(/\[IMG:(.*?)\]/);
            return {
                txt: lines[0].replace(/\[IMG:.*?\]/, "").trim(),
                img: imgMatch ? imgMatch[1] : null,
                opts: lines.slice(1, 5),
                key: (aRaw.match(new RegExp(`${i+1}\\s*([A-D])`)) || [])[1] || 'A'
            };
        });
        db.push({ id: Date.now(), name, qs, history: [] });
        saveAndReload();
    }

    function renderDash() {
        const list = document.getElementById('test-list');
        list.innerHTML = db.map((t, i) => `
            <div class="card" style="margin-bottom:0">
                <h3 style="margin:0">${t.name}</h3>
                <p style="font-size:0.8rem; color:gray">${t.qs.length} Questions</p>
                <div style="margin:10px 0">
                    ${t.history.slice(-1).map(h => `<div style="font-size:0.7rem; color:var(--s); font-weight:700">Last Score: ${h.s} (${h.d})</div>`).join('')}
                </div>
                <div style="display:flex; gap:10px">
                    <button class="btn btn-p" onclick="start(${i})">Attempt</button>
                    <button class="btn btn-s admin-only" onclick="deleteT(${i})">Del</button>
                </div>
            </div>
        `).join('');
    }

    function start(idx) {
        state.t = db[idx]; state.idx = 0; state.ans = {}; state.mode = 'exam';
        document.getElementById('v-dash').style.display = 'none';
        document.getElementById('v-quiz').style.display = 'block';
        document.getElementById('timer').style.display = 'block';
        renderQ();
    }

    function renderQ() {
        const q = state.t.qs[state.idx];
        let html = `<h2>Q${state.idx+1}. ${q.txt}</h2>`;
        if(q.img) html += `<img src="${q.img}" class="q-img" onerror="this.style.display='none'">`;
        ["A", "B", "C", "D"].forEach((l, i) => {
            let cls = 'option';
            if(state.mode === 'exam') { if(state.ans[state.idx] === l) cls += ' selected'; }
            else {
                if(l === q.key) cls += ' correct';
                if(state.ans[state.idx] === l && l !== q.key) cls += ' wrong';
            }
            html += `<div class="${cls}" onclick="pick('${l}')"><b>${l}.</b> ${q.opts[i] || ''}</div>`;
        });
        if(state.mode === 'analysis') {
            html += `<iframe class="sol-frame" src="https://www.bing.com/search?q=NCERT+solution+${encodeURIComponent(q.txt)}"></iframe>`;
        }
        document.getElementById('q-area').innerHTML = html;
        let p = '';
        state.t.qs.forEach((_, i) => p += `<div class="dot ${state.ans[i]?'answered':''} ${i===state.idx?'active':''}" onclick="state.idx=${i}; renderQ()">${i+1}</div>`);
        document.getElementById('palette').innerHTML = p;
    }

    function pick(l) { if(state.mode === 'exam') { state.ans[state.idx] = l; renderQ(); } }
    function move(d) { state.idx = Math.max(0, Math.min(state.t.qs.length - 1, state.idx + d)); renderQ(); }

    function finish() {
        let c = 0, w = 0;
        state.t.qs.forEach((q, i) => {
            if(state.ans[i] === q.key) c++;
            else if(state.ans[i]) w++;
        });
        const score = (c * 4) - w;
        state.t.history.push({ s: score, d: new Date().toLocaleDateString() });
        localStorage.setItem('genie_ultra_final', JSON.stringify(db)); // Immediate Save
        
        document.getElementById('v-quiz').style.display = 'none';
        document.getElementById('timer').style.display = 'none';
        const res = document.getElementById('view-result'); 
        const resView = document.getElementById('v-res');
        resView.style.display = 'block';
        resView.innerHTML = `
            <div class="card" style="text-align:center">
                <h1 style="font-size:3rem; color:var(--p); margin:0">${score}</h1>
                <p>Correct: ${c} | Wrong: ${w}</p>
                <button class="btn btn-p" onclick="state.mode='analysis'; state.idx=0; document.getElementById('v-res').style.display='none'; document.getElementById('v-quiz').style.display='block'; renderQ()">Review Solutions</button>
                <button class="btn btn-s" style="width:100%; margin-top:10px" onclick="location.reload()">Back to Home</button>
            </div>
            <div class="about-card">
                <h2 style="margin:0">Abhishek (Ydaabhi)</h2>
                <p>Umeed hai ye test aapki preparation mein kaam aayega!</p>
                <a href="https://t.me/Ydaabhi07" target="_blank" class="social-btn">Join Telegram</a>
            </div>`;
    }

    function deleteT(i) { if(confirm("Delete?")) { db.splice(i, 1); saveAndReload(); } }
    function exportData() {
        const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = 'Abhishek_Master_Data.genie'; a.click();
    }
    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => { db = JSON.parse(ev.target.result); saveAndReload(); };
        reader.readAsText(e.target.files[0]);
    }
    function saveAndReload() { localStorage.setItem('genie_ultra_final', JSON.stringify(db)); renderDash(); }

    renderDash();
</script>
</body>
</html>
