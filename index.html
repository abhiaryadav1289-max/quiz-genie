<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie PRO | Official Exam Portal</title>
    <style>
        :root {
            --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --primary: #38bdf8;
            --accent: #818cf8; --text: #f1f5f9; --danger: #f43f5e; --success: #10b981; --glass: rgba(255, 255, 255, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        nav { display: flex; justify-content: space-between; padding: 1rem 5%; background: var(--glass); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top:0; z-index:100; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); cursor: pointer; }
        .logo span { color: var(--accent); }

        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; animation: fadeIn 0.5s ease-in; }
        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }

        .option { display: block; width: 100%; padding: 1.2rem; margin: 0.8rem 0; background: var(--glass); border: 2px solid transparent; border-radius: 12px; text-align: left; cursor: pointer; color: inherit; }
        .option.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.15); }
        
        .progress-bar { width: 100%; height: 10px; background: var(--glass); border-radius: 10px; margin: 1.5rem 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-box { padding: 20px; border-radius: 15px; background: var(--glass); text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .analysis-card { margin-top: 15px; background: var(--glass); padding: 20px; border-radius: 12px; border-left: 5px solid var(--primary); }

        textarea, input { width: 100%; padding: 12px; margin: 10px 0; background: var(--glass); color: var(--text); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; outline: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="location.reload()">NEET<span>Genie PRO</span></div>
    <div style="display:flex; gap:10px;">
        <button class="btn btn-outline" onclick="location.reload()">🏠 Home</button>
        <button id="admin-btn" class="btn btn-primary" onclick="window.checkAuth()">⚙️ Admin</button>
    </div>
</nav>

<div class="container">
    <section id="view-dashboard">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 2rem;">
             <h2>🎯 Live Test Series</h2>
             <div id="admin-stats-header" class="hidden" style="font-size: 0.8rem; background: var(--glass); padding: 5px 12px; border-radius: 20px;"></div>
        </div>
        <div id="test-list" class="grid">Checking for live tests...</div>
    </section>

    <section id="view-quiz" class="hidden">
        <div class="card" style="max-width: 850px; margin: auto;">
            <div style="display:flex; justify-content:space-between; align-items: center;">
                <h3 id="q-title">NEET Mock</h3>
                <div style="text-align: right;">
                    <div id="timer" style="color:var(--danger); font-weight:800; font-size: 1.5rem; font-family: monospace;">00:00</div>
                    <div id="pause-indicator" style="color:var(--accent); font-size: 0.7rem; font-weight: bold;" class="hidden">⏸️ PAUSED</div>
                </div>
            </div>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            <div id="quiz-body">
                <p id="q-text" style="font-size:1.2rem; margin:1.5rem 0; font-weight: 500;"></p>
                <div id="options-area"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:2rem;">
                <button class="btn btn-outline" onclick="window.changeQ(-1)">⬅️ Prev</button>
                <button class="btn btn-primary" id="next-btn" onclick="window.changeQ(1)">Next ➡️</button>
                <button class="btn btn-danger hidden" id="submit-btn" onclick="window.finishQuiz()">🚀 Submit Test</button>
                <button class="btn btn-outline" id="pause-btn" onclick="window.togglePause()">⏸️ Pause</button>
            </div>
        </div>
    </section>

    <section id="view-result" class="hidden">
        <div class="card" style="max-width: 800px; margin: auto; text-align:center;">
            <h2 id="perf-msg">Scorecard</h2>
            <div style="font-size: 4rem; margin: 15px 0; color: var(--primary); font-weight: 900;" id="final-score">0</div>
            <div class="stat-grid">
                <div class="stat-box">✔️ Correct<b id="res-correct" style="color:var(--success)">0</b></div>
                <div class="stat-box">❌ Wrong<b id="res-wrong" style="color:var(--danger)">0</b></div>
                <div class="stat-box">⚪ Skipped<b id="res-skip">0</b></div>
                <div class="stat-box">🎯 Accuracy<b id="res-acc">0%</b></div>
            </div>
            <div id="weak-areas" style="margin: 15px 0; color: var(--danger); font-size: 0.9rem;" class="hidden"></div>
            <div style="display:flex; gap:10px; justify-content: center; margin-bottom: 30px;">
                <button class="btn btn-primary" onclick="window.reattempt()">🔄 Reattempt</button>
                <button class="btn btn-outline" onclick="location.reload()">🏠 Home</button>
            </div>
            <h3 style="text-align:left; border-bottom: 1px solid var(--glass); padding-bottom: 10px;">Detailed Analysis</h3>
            <div id="analysis-area" style="text-align:left;"></div>
        </div>
    </section>

    <section id="view-admin" class="hidden">
        <div class="card">
            <h2>🚀 Add New Test</h2>
            <input type="text" id="t-name" placeholder="Test Name">
            <input type="number" id="t-time" placeholder="Time (Minutes)">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <textarea id="t-qs" placeholder="Q1. Question?&#10;A. Opt1&#10;B. Opt2..."></textarea>
                <textarea id="t-as" placeholder="1-A&#10;2-C..."></textarea>
            </div>
            <button class="btn btn-primary" style="width:100%; margin-top:10px" onclick="window.upload()">Upload Test</button>
        </div>
        <h3 style="margin-top: 2rem;">Manage Tests</h3>
        <div id="admin-manage-list" class="grid" style="margin-top: 1rem;"></div>
    </section>

    <section id="view-auth" class="hidden">
        <div class="card" style="max-width:400px; margin:auto;">
            <h3>Admin Authorization</h3>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn btn-primary" style="width:100%" onclick="window.login()">Login</button>
        </div>
    </section>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, getDoc, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1Yk3k4LgpPLBm0hp73tMYuDEDiJaRamM",
        authDomain: "neet-genie.firebaseapp.com",
        projectId: "neet-genie",
        storageBucket: "neet-genie.firebasestorage.app",
        messagingSenderId: "91475548401",
        appId: "1:91475548401:web:f395534d6d806d52713150"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let activeTest = null;
    let userAns = [];
    let index = 0;
    let clock;
    let timeLeft = 0;
    let isPaused = false;

    window.show = (id) => {
        document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
        document.getElementById('view-' + id).classList.remove('hidden');
    };

    // --- Persistence ---
    function saveProgress() {
        if (!activeTest) return;
        localStorage.setItem('neet_save', JSON.stringify({ activeTest, userAns, index, timeLeft }));
    }

    function checkResume() {
        const saved = localStorage.getItem('neet_save');
        if (saved) {
            const data = JSON.parse(saved);
            if (confirm("Resume your previous test?")) {
                activeTest = data.activeTest;
                userAns = data.userAns;
                index = data.index;
                timeLeft = data.timeLeft;
                show('quiz');
                render();
                startTimer();
            } else { localStorage.removeItem('neet_save'); }
        }
    }

    // --- Load Data ---
    async function refreshDashboard() {
        try {
            const q = query(collection(db, "tests"), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            const list = document.getElementById('test-list');
            const admList = document.getElementById('admin-manage-list');
            list.innerHTML = ""; admList.innerHTML = "";

            if (snap.empty) { list.innerHTML = "No tests available."; return; }

            if(auth.currentUser) {
                document.getElementById('admin-stats-header').innerText = `Tests: ${snap.size}`;
                document.getElementById('admin-stats-header').classList.remove('hidden');
            }

            snap.forEach(d => {
                const data = d.data();
                list.innerHTML += `<div class="card">
                    <h3>${data.testName}</h3>
                    <p>📝 ${data.questions.length} MCQs | ⏱ ${data.duration}m</p>
                    <button class="btn btn-primary" style="width:100%; margin-top:10px" onclick="window.startQuiz('${d.id}')">Start Test</button>
                </div>`;
                if(auth.currentUser) {
                    admList.innerHTML += `<div class="card"><h4>${data.testName}</h4><button class="btn btn-danger" style="width:100%" onclick="window.removeTest('${d.id}')">Delete</button></div>`;
                }
            });
        } catch (e) { console.error(e); }
    }

    // --- Test Core ---
    window.startQuiz = async (id) => {
        const snap = await getDoc(doc(db, "tests", id));
        if(!snap.exists()) return;
        activeTest = snap.data();
        activeTest.id = id;
        activeTest.questions = activeTest.questions.sort(() => Math.random() - 0.5);
        userAns = new Array(activeTest.questions.length).fill(null);
        index = 0;
        timeLeft = activeTest.duration * 60;
        show('quiz');
        render();
        startTimer();
    };

    function render() {
        const q = activeTest.questions[index];
        document.getElementById('q-title').innerText = activeTest.testName;
        document.getElementById('q-text').innerText = `${index + 1}. ${q.question}`;
        const area = document.getElementById('options-area');
        area.innerHTML = "";
        ["A","B","C","D"].forEach((l, i) => {
            const b = document.createElement('button');
            b.className = `option ${userAns[index] === l ? 'selected' : ''}`;
            b.innerText = `${l}. ${q.options[i] || '---'}`;
            b.onclick = () => { if(!isPaused) { userAns[index] = l; render(); saveProgress(); } };
            area.appendChild(b);
        });
        document.getElementById('progress-fill').style.width = `${((index + 1) / activeTest.questions.length) * 100}%`;
        document.getElementById('next-btn').classList.toggle('hidden', index === activeTest.questions.length - 1);
        document.getElementById('submit-btn').classList.toggle('hidden', index !== activeTest.questions.length - 1);
    }

    window.changeQ = (n) => { if(!isPaused) { index += n; render(); } };

    function startTimer() {
        if(clock) clearInterval(clock);
        clock = setInterval(() => {
            if(!isPaused) {
                let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                document.getElementById('timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                if (timeLeft <= 0) { clearInterval(clock); window.finishQuiz(); }
                timeLeft--;
            }
        }, 1000);
    }

    window.togglePause = () => {
        isPaused = !isPaused;
        document.getElementById('pause-indicator').classList.toggle('hidden', !isPaused);
        document.getElementById('quiz-body').style.opacity = isPaused ? "0.2" : "1";
        document.getElementById('pause-btn').innerText = isPaused ? "▶️ Resume" : "⏸️ Pause";
    };

    window.finishQuiz = () => {
        clearInterval(clock);
        localStorage.removeItem('neet_save');
        let c = 0, w = 0, s = 0, html = "";
        activeTest.questions.forEach((q, i) => {
            const ua = userAns[i], ca = q.answer || q.correctAnswer;
            if(!ua) s++; else if(ua === ca) c++; else w++;
            html += `<div class="analysis-card" style="border-left-color:${ua===ca?'var(--success)':'var(--danger)'}">
                <p><b>Q${i+1}:</b> ${q.question}</p>
                <p>Ans: ${ua || 'Skipped'} | Correct: ${ca}</p>
            </div>`;
        });
        show('result');
        document.getElementById('final-score').innerText = `${c}/${activeTest.questions.length}`;
        document.getElementById('res-correct').innerText = c;
        document.getElementById('res-wrong').innerText = w;
        document.getElementById('res-skip').innerText = s;
        document.getElementById('res-acc').innerText = Math.round((c/(c+w||1))*100) + "%";
        document.getElementById('analysis-area').innerHTML = html;
    };

    window.reattempt = () => window.startQuiz(activeTest.id);

    // --- Admin Functions ---
    window.checkAuth = () => { auth.currentUser ? show('admin') : show('auth'); };
    window.login = () => {
        signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value)
        .then(() => { show('admin'); refreshDashboard(); }).catch(e => alert("Login Failed"));
    };
    window.upload = async () => {
        const name = document.getElementById('t-name').value, time = document.getElementById('t-time').value;
        const qRaw = document.getElementById('t-qs').value, aRaw = document.getElementById('t-as').value;
        try {
            const questions = qRaw.split(/Q\d+[\.\s]*/g).filter(b => b.trim().length > 5).map((block, i) => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l !== "");
                const options = [];
                lines.forEach(l => { if(l.match(/^[A-D][\.\)\s]/)) options.push(l.replace(/^[A-D][\.\)\s]*/, "").trim()); });
                const m = aRaw.match(new RegExp(`(?:^|\\n)${i+1}[\\s\\-\\.]*([A-D])`, 'i'));
                return { question: lines[0], options, answer: m ? m[1].toUpperCase() : "A" };
            });
            await addDoc(collection(db, "tests"), { testName: name, duration: parseInt(time), questions, createdAt: Date.now() });
            alert("Uploaded!"); location.reload();
        } catch (e) { alert("Format Error"); }
    };
    window.removeTest = async (id) => { if(confirm("Delete?")) { await deleteDoc(doc(db, "tests", id)); refreshDashboard(); } };

    onAuthStateChanged(auth, (user) => { refreshDashboard(); checkResume(); });
</script>
</body>
</html>
