<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie Ultra | Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #4f46e5; --s: #10b981; --d: #ef4444; --bg: #f3f4f6; --sur: #ffffff; --txt: #1e293b; --bdr: #e5e7eb; }
        [data-theme='dark'] { --bg: #0f172a; --sur: #1e293b; --txt: #f1f5f9; --bdr: #334155; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; color: var(--txt); transition: 0.3s; }
        header { background: #1e1b4b; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: var(--sur); padding: 1.5rem; border-radius: 20px; border: 1px solid var(--bdr); box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        .option { padding: 1rem; border: 1.5px solid var(--bdr); border-radius: 12px; margin-bottom: 0.8rem; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .option.selected { background: #eef2ff; border-color: var(--p); color: var(--p); }
        .option.correct { background: #dcfce7 !important; border-color: var(--s) !important; color: #166534 !important; }
        .option.wrong { background: #fee2e2 !important; border-color: var(--d) !important; color: #991b1b !important; }
        .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .dot { height: 40px; display: flex; align-items: center; justify-content: center; background: var(--bg); border: 1px solid var(--bdr); border-radius: 10px; cursor: pointer; font-weight: 700; color: var(--txt); }
        .dot.answered { background: var(--s); color: white; }
        .dot.active { border: 2px solid var(--p); color: var(--p); }
        .btn { padding: 0.8rem 1.2rem; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-p { background: var(--p); color: white; }
        .btn-s { background: var(--bg); color: var(--txt); border: 1px solid var(--bdr); }
        textarea, input { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--bdr); background: var(--sur); color: var(--txt); margin-bottom: 10px; box-sizing: border-box; }
        .q-img { max-width: 100%; border-radius: 12px; margin: 15px 0; }
        .ai-box { background: #f0f9ff; border: 1px solid #bae6fd; padding: 15px; border-radius: 12px; margin-top: 15px; color: #0369a1; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="location.reload()" style="cursor:pointer; font-weight: 800;">NEET GENIE <span style="opacity:0.7">ULTRA</span></div>
    <div style="display:flex; gap:15px; align-items:center;">
        <div id="timer" style="display:none; font-family: monospace; font-size: 1.1rem;">00:00</div>
        <button class="btn-s" onclick="toggleTheme()" style="width: 35px; height: 35px; border-radius: 50%;">🌓</button>
    </div>
</header>

<div class="container" id="v-dash">
    <div class="card" style="background: linear-gradient(135deg, #1e1b4b, #4338ca); color: white; border: none;">
        <h2>Test Library</h2>
        <input type="password" id="gemini-key" placeholder="Paste Gemini API Key for AI Analysis (Optional)" style="margin-top:10px; background:rgba(255,255,255,0.1); color:white; border:none;">
    </div>

    <div class="card">
        <h3>Create Test</h3>
        <input type="text" id="t-name" placeholder="Test Name">
        <textarea id="t-qs" rows="5" placeholder="Paste Qns (Q1. or Q32. doesn't matter)"></textarea>
        <textarea id="t-ans" rows="2" placeholder="Paste Keys (1. A 2. B 3. C...)"></textarea>
        <button class="btn btn-p" style="width:100%" onclick="saveTest()">Save Test</button>
    </div>
    <div id="test-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:1.5rem;"></div>
</div>

<div class="container" id="v-quiz" style="display:none">
    <div style="display:grid; grid-template-columns: 1fr 300px; gap:20px;">
        <div class="card">
            <div id="q-area"></div>
            <div style="display:flex; gap:10px; margin-top:20px">
                <button class="btn btn-s" onclick="move(-1)">Back</button>
                <button class="btn btn-s" onclick="move(1)">Next</button>
                <button class="btn btn-p" style="flex:1; background:var(--d)" onclick="finish()">Finish</button>
            </div>
        </div>
        <div class="card">
            <h4>Navigator</h4>
            <div class="palette" id="palette"></div>
        </div>
    </div>
</div>

<div class="container" id="v-res" style="display:none"></div>

<script>
    let db = JSON.parse(localStorage.getItem('genie_ultra_v3')) || [];
    let state = { tIdx: null, t: null, ans: {}, idx: 0, mode: 'exam', timer: 0, timerInt: null };

    function toggleTheme() {
        const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', theme);
    }

    function saveTest() {
        const name = document.getElementById('t-name').value || "Unnamed Test";
        const qRaw = document.getElementById('t-qs').value;
        const aRaw = document.getElementById('t-ans').value;
        
        const blocks = qRaw.split(/Q\d+[\.\:]/).filter(b => b.trim());
        const keys = aRaw.match(/[A-D](?=\s|$|\.|\,)/gi); // Just extracts all A, B, C, D in order

        const qs = blocks.map((b, i) => {
            const lines = b.trim().split('\n').filter(l => l.trim());
            const imgMatch = lines[0].match(/\[IMG:(.*?)\]/);
            return {
                txt: lines[0].replace(/\[IMG:.*?\]/, "").trim(),
                img: imgMatch ? imgMatch[1] : null,
                opts: lines.slice(1, 5).map(opt => opt.replace(/^[A-D][\)\.\s]\s*/i, "").trim()),
                key: (keys && keys[i]) ? keys[i].toUpperCase() : 'A' // Matches by sequence, not by Q number
            };
        });

        db.push({ id: Date.now(), name, qs, history: [] });
        localStorage.setItem('genie_ultra_v3', JSON.stringify(db));
        location.reload();
    }

    function renderDash() {
        document.getElementById('test-list').innerHTML = db.map((t, i) => `
            <div class="card">
                <h3>${t.name}</h3>
                <p style="font-size:0.8rem; opacity:0.6">${t.qs.length} Questions</p>
                <button class="btn btn-p" style="margin-top:10px" onclick="start(${i})">Start Practice</button>
                <button class="btn btn-s" onclick="deleteT(${i})">🗑</button>
            </div>
        `).join('');
    }

    function start(idx) {
        state.tIdx = idx; state.t = db[idx]; state.idx = 0; state.ans = {}; state.mode = 'exam';
        document.getElementById('v-dash').style.display = 'none';
        document.getElementById('v-quiz').style.display = 'block';
        renderQ();
    }

    function renderQ() {
        const q = state.t.qs[state.idx];
        let html = `<h2>Q${state.idx+1}. ${q.txt}</h2>`;
        if(q.img) html += `<img src="${q.img}" class="q-img" onerror="this.style.display='none'">`;
        
        ["A", "B", "C", "D"].forEach((l, i) => {
            let cls = 'option';
            if(state.mode === 'exam') { if(state.ans[state.idx] === l) cls += ' selected'; }
            else {
                if(l === q.key) cls += ' correct';
                else if(state.ans[state.idx] === l) cls += ' wrong';
            }
            html += `<div class="${cls}" onclick="pick('${l}')"><b>${l}.</b> ${q.opts[i] || ''}</div>`;
        });

        if(state.mode === 'analysis') {
            html += `<div class="ai-box"><b>Solution:</b> The correct answer is option <b>${q.key}</b>. </div>`;
            html += `<iframe style="width:100%; height:300px; border:none; margin-top:10px; border-radius:12px" src="https://www.bing.com/search?q=NCERT+solution+${encodeURIComponent(q.txt)}"></iframe>`;
        }
        document.getElementById('q-area').innerHTML = html;
        renderPalette();
    }

    function renderPalette() {
        let p = '';
        state.t.qs.forEach((_, i) => p += `<div class="dot ${state.ans[i]?'answered':''} ${i===state.idx?'active':''}" onclick="state.idx=${i}; renderQ()">${i+1}</div>`);
        document.getElementById('palette').innerHTML = p;
    }

    function pick(l) { if(state.mode === 'exam') { state.ans[state.idx] = l; renderQ(); } }
    function move(d) { 
        let newIdx = state.idx + d;
        if(newIdx >= 0 && newIdx < state.t.qs.length) {
            state.idx = newIdx;
            renderQ();
        }
    }

    function finish() {
        document.getElementById('v-quiz').style.display = 'none';
        const res = document.getElementById('v-res');
        res.style.display = 'block';
        res.innerHTML = `
            <div class="card" style="text-align:center">
                <h1>Test Result</h1>
                <button class="btn btn-p" onclick="state.mode='analysis'; state.idx=0; document.getElementById('v-res').style.display='none'; document.getElementById('v-quiz').style.display='block'; renderQ()">Review Answers</button>
                <button class="btn btn-s" onclick="location.reload()" style="width:100%; margin-top:10px">Back to Home</button>
            </div>
        `;
    }

    function deleteT(i) { if(confirm("Delete?")) { db.splice(i, 1); localStorage.setItem('genie_ultra_v3', JSON.stringify(db)); renderDash(); } }
    renderDash();
</script>
</body>
</html>
