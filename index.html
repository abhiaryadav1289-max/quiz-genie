<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET GENIE Pro – Advanced Exam Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-sky { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, addDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyB1Yk3k4LgpPLBm0hp73tMYuDEDiJaRamM",
            authDomain: "neet-genie.firebaseapp.com",
            projectId: "neet-genie",
            storageBucket: "neet-genie.firebasestorage.app",
            messagingSenderId: "91475548401",
            appId: "1:91475548401:web:f395534d6d806d52713150"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- UTILS ---
        const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h > 0 ? h + ':' : ''}${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        // --- SHARED COMPONENTS ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
            const colors = type === 'error' ? 'bg-red-500' : 'bg-emerald-500';
            return (
                <div className={`fixed bottom-5 right-5 ${colors} text-white px-6 py-3 rounded-lg shadow-2xl z-[100] animate-fade`}>
                    {message}
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [view, setView] = useState('loading'); // loading, auth, dashboard, test, result, admin, profile, leaderboard
            const [toast, setToast] = useState(null);
            const [selectedResult, setSelectedResult] = useState(null);
            const [currentTest, setCurrentTest] = useState(null);
            const [activeAttempt, setActiveAttempt] = useState(null);

            const showToast = (msg, type = 'success') => setToast({ msg, type });

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        const snap = await getDoc(doc(db, "users", u.uid));
                        if (snap.exists()) {
                            setUserData(snap.data());
                            setUser(u);
                            setView('dashboard');
                        }
                    } else {
                        setView('auth');
                    }
                });
                return () => unsub();
            }, []);

            const navigate = (v) => {
                if (v === 'admin' && userData?.role !== 'admin') {
                    showToast("Access Denied", "error");
                    return;
                }
                setView(v);
            };

            if (view === 'loading') return <div className="h-screen flex items-center justify-center bg-slate-950 text-sky-500 font-bold">Initializing Genie...</div>;

            return (
                <div className="min-h-screen bg-[#0f172a] text-slate-200">
                    {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                    
                    {view === 'auth' ? (
                        <AuthView showToast={showToast} />
                    ) : (
                        <div className="flex flex-col md:flex-row min-h-screen">
                            {/* Sidebar / Nav */}
                            <nav className="w-full md:w-64 glass border-r border-white/5 p-6 flex flex-col gap-2">
                                <h1 className="text-2xl font-bold text-sky-400 mb-8 flex items-center gap-2">
                                    <span className="p-2 gradient-sky rounded-lg text-white text-sm">NG</span>
                                    NEET Genie
                                </h1>
                                <NavItem active={view === 'dashboard'} onClick={() => navigate('dashboard')} icon="🏠" label="Dashboard" />
                                <NavItem active={view === 'leaderboard'} onClick={() => navigate('leaderboard')} icon="🏆" label="Leaderboard" />
                                <NavItem active={view === 'profile'} onClick={() => navigate('profile')} icon="👤" label="My Profile" />
                                
                                {userData?.role === 'admin' && (
                                    <>
                                        <div className="my-4 border-t border-white/10 pt-4 text-xs font-bold text-slate-500 uppercase tracking-widest">Admin</div>
                                        <NavItem active={view === 'admin'} onClick={() => navigate('admin')} icon="⚙️" label="Admin Panel" />
                                    </>
                                )}
                                
                                <div className="mt-auto pt-6">
                                    <button onClick={() => signOut(auth)} className="w-full text-left p-3 rounded-xl hover:bg-red-500/10 text-red-400 transition-all flex items-center gap-3">
                                        <span>🚪</span> Logout
                                    </button>
                                </div>
                            </nav>

                            {/* Main Content */}
                            <main className="flex-1 p-4 md:p-10 overflow-y-auto custom-scroll">
                                {view === 'dashboard' && <Dashboard user={user} setView={setView} setCurrentTest={setCurrentTest} setActiveAttempt={setActiveAttempt} />}
                                {view === 'test' && <TestInterface user={user} test={currentTest} initialAttempt={activeAttempt} setView={setView} setSelectedResult={setSelectedResult} showToast={showToast} />}
                                {view === 'result' && <ResultView result={selectedResult} setView={setView} />}
                                {view === 'leaderboard' && <Leaderboard />}
                                {view === 'profile' && <Profile user={user} userData={userData} setView={setView} setSelectedResult={setSelectedResult} />}
                                {view === 'admin' && <AdminPanel showToast={showToast} />}
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const NavItem = ({ active, onClick, icon, label }) => (
            <button onClick={onClick} className={`flex items-center gap-3 p-3 rounded-xl transition-all ${active ? 'gradient-sky text-white shadow-lg shadow-sky-500/20' : 'hover:bg-white/5 text-slate-400'}`}>
                <span className="text-lg">{icon}</span>
                <span className="font-medium">{label}</span>
            </button>
        );

        const AuthView = ({ showToast }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [loading, setLoading] = useState(false);
            const [form, setForm] = useState({ email: '', password: '', name: '' });

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    if (isLogin) {
                        await signInWithEmailAndPassword(auth, form.email, form.password);
                    } else {
                        const res = await createUserWithEmailAndPassword(auth, form.email, form.password);
                        await setDoc(doc(db, "users", res.user.uid), {
                            name: form.name, email: form.email, role: 'user', joinedAt: serverTimestamp()
                        });
                    }
                } catch (err) {
                    showToast(err.message, 'error');
                } finally { setLoading(false); }
            };

            return (
                <div className="h-screen flex items-center justify-center p-4 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-sky-900/20 via-slate-950 to-slate-950">
                    <div className="glass p-8 rounded-3xl w-full max-w-md shadow-2xl animate-fade">
                        <div className="text-center mb-8">
                            <h2 className="text-3xl font-bold text-white mb-2">NEET <span className="text-sky-500">GENIE</span></h2>
                            <p className="text-slate-400">{isLogin ? 'Welcome back, Doctor!' : 'Join the elite ranks'}</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <input type="text" placeholder="Full Name" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-sky-500 transition-all" required onChange={e => setForm({...form, name: e.target.value})} />
                            )}
                            <input type="email" placeholder="Email Address" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-sky-500 transition-all" required onChange={e => setForm({...form, email: e.target.value})} />
                            <input type="password" placeholder="Password" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-sky-500 transition-all" required onChange={e => setForm({...form, password: e.target.value})} />
                            <button disabled={loading} className="w-full gradient-sky text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-90 disabled:opacity-50 transition-all">
                                {loading ? 'Processing...' : isLogin ? 'Sign In' : 'Create Account'}
                            </button>
                        </form>
                        <p className="text-center mt-6 text-sm text-slate-400">
                            {isLogin ? "Don't have an account?" : "Already a member?"}
                            <button onClick={() => setIsLogin(!isLogin)} className="ml-2 text-sky-400 font-bold">
                                {isLogin ? 'Register Now' : 'Login'}
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user, setView, setCurrentTest, setActiveAttempt }) => {
            const [tests, setTests] = useState([]);
            const [resumable, setResumable] = useState(null);

            useEffect(() => {
                const qT = query(collection(db, "tests"), where("isActive", "==", true), orderBy("createdAt", "desc"));
                const unsubTests = onSnapshot(qT, (s) => setTests(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubActive = onSnapshot(doc(db, "active_attempts", user.uid), (d) => setResumable(d.exists() ? d.data() : null));
                return () => { unsubTests(); unsubActive(); };
            }, []);

            return (
                <div className="animate-fade">
                    <header className="mb-10">
                        <h2 className="text-3xl font-bold text-white mb-2">Genie Dashboard</h2>
                        <p className="text-slate-400">Select a mock test to evaluate your NEET preparation.</p>
                    </header>

                    {resumable && (
                        <div className="mb-8 p-6 rounded-2xl bg-sky-500/10 border border-sky-500/30 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h3 className="font-bold text-sky-400 text-lg">In-Progress Test Found!</h3>
                                <p className="text-sm text-slate-300">You were attempting <b>{resumable.testName}</b>. Your progress is saved.</p>
                            </div>
                            <button onClick={async () => {
                                const snap = await getDoc(doc(db, "tests", resumable.testId));
                                setCurrentTest({id: snap.id, ...snap.data()});
                                setActiveAttempt(resumable);
                                setView('test');
                            }} className="gradient-sky px-6 py-2 rounded-xl font-bold text-white shadow-lg">Resume Test</button>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {tests.map(test => (
                            <div key={test.id} className="glass p-6 rounded-2xl border border-white/5 card-hover flex flex-col">
                                <div className="mb-4 flex justify-between items-start">
                                    <div className="p-3 bg-white/5 rounded-xl text-2xl">🧬</div>
                                    <span className="text-[10px] bg-sky-500/20 text-sky-400 px-2 py-1 rounded-md font-bold uppercase">{test.duration} MIN</span>
                                </div>
                                <h4 className="text-xl font-bold text-white mb-2">{test.name}</h4>
                                <p className="text-slate-400 text-sm mb-6 flex-grow">{test.totalQuestions} MCQ Questions • +4/-1 Scheme</p>
                                <button onClick={() => { setCurrentTest(test); setActiveAttempt(null); setView('test'); }} className="w-full py-3 bg-white/5 border border-white/10 hover:bg-sky-500 hover:border-sky-500 text-white rounded-xl font-bold transition-all">Start Attempt</button>
                            </div>
                        ))}
                        {tests.length === 0 && <div className="col-span-full p-20 text-center text-slate-500 italic">No tests published yet...</div>}
                    </div>
                </div>
            );
        };

        const TestInterface = ({ user, test, initialAttempt, setView, setSelectedResult, showToast }) => {
            const [qIdx, setQIdx] = useState(0);
            const [answers, setAnswers] = useState(initialAttempt?.answers || {});
            const [marked, setMarked] = useState(initialAttempt?.marked || []);
            const [timeLeft, setTimeLeft] = useState(initialAttempt?.timeRemaining || test.duration * 60);

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) { clearInterval(timer); finishTest(); return 0; }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const autoSave = setInterval(() => {
                    setDoc(doc(db, "active_attempts", user.uid), {
                        testId: test.id, testName: test.name, answers, marked, timeRemaining: timeLeft, startedAt: initialAttempt?.startedAt || serverTimestamp()
                    });
                }, 10000);
                return () => clearInterval(autoSave);
            }, [answers, marked, timeLeft]);

            const finishTest = async () => {
                let correct = 0, wrong = 0, unattempted = 0;
                test.questions.forEach(q => {
                    const ans = answers[q.id];
                    if (ans === undefined) unattempted++;
                    else if (ans === q.correct) correct++;
                    else wrong++;
                });
                const rawScore = (correct * 4) - (wrong * 1);
                const score = Math.max(0, rawScore); // NEET Rule: Min 0 enforced by app logic here

                const resultData = {
                    userId: user.uid, userName: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
                    testId: test.id, testName: test.name, score, correct, wrong, unattempted, submittedAt: serverTimestamp()
                };
                
                const docRef = await addDoc(collection(db, "attempts"), resultData);
                await deleteDoc(doc(db, "active_attempts", user.uid));
                setSelectedResult({id: docRef.id, ...resultData});
                setView('result');
            };

            const toggleMark = (id) => {
                setMarked(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            };

            const q = test.questions[qIdx];
            const isAnswered = (id) => answers[id] !== undefined;

            return (
                <div className="flex flex-col lg:flex-row gap-6 max-w-7xl mx-auto h-[calc(100vh-100px)]">
                    {/* Left: Question Content */}
                    <div className="flex-1 glass rounded-3xl overflow-hidden flex flex-col border border-white/10">
                        <div className="bg-slate-900/50 p-4 flex justify-between items-center border-b border-white/5">
                            <div className="flex flex-col">
                                <span className="text-xs font-bold text-sky-400 uppercase tracking-tighter">Current Question</span>
                                <span className="font-bold text-white">{test.name}</span>
                            </div>
                            <div className="bg-sky-500 text-white px-4 py-2 rounded-xl font-mono text-xl shadow-lg shadow-sky-500/20">
                                {formatTime(timeLeft)}
                            </div>
                        </div>

                        <div className="flex-1 p-6 md:p-10 overflow-y-auto custom-scroll">
                            <div className="mb-8">
                                <span className="bg-white/5 px-3 py-1 rounded-lg text-xs font-bold text-slate-400 mb-4 inline-block">QUESTION {qIdx + 1}</span>
                                <h3 className="text-xl md:text-2xl text-white font-medium leading-relaxed">{q.question}</h3>
