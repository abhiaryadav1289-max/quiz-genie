<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie | Master Portal</title>
    
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --accent: #818cf8;
            --text: #f1f5f9;
            --danger: #f43f5e;
            --success: #10b981;
            --glass: rgba(255, 255, 255, 0.05);
        }

        .light-theme {
            --bg: #f8fafc;
            --card: rgba(255, 255, 255, 0.9);
            --text: #1e293b;
            --glass: rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* Navbar */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 5%; background: var(--glass); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .logo span { color: var(--text); }

        /* Buttons */
        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        /* Layout */
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }

        /* Test Card */
        .card { 
            background: var(--card); border: 1px solid rgba(255,255,255,0.1); 
            padding: 1.5rem; border-radius: 16px; backdrop-filter: blur(10px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        /* Quiz Interface */
        .quiz-box { max-width: 800px; margin: auto; }
        .option { 
            display: block; width: 100%; padding: 1rem; margin: 0.5rem 0; 
            background: var(--glass); border: 2px solid transparent; border-radius: 10px; 
            text-align: left; cursor: pointer; font-size: 1rem; color: inherit;
        }
        .option:hover { border-color: var(--primary); }
        .option.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.1); }
        
        .progress-bar { width: 100%; height: 8px; background: var(--glass); border-radius: 10px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; }

        /* Admin Panel */
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        textarea { width: 100%; height: 200px; background: var(--glass); color: var(--text); border-radius: 8px; padding: 1rem; border: 1px solid rgba(255,255,255,0.1); }
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: var(--glass); color: var(--text); }

        /* Results */
        .result-screen { text-align: center; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; border: 5px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 2rem auto; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">NEET<span>Genie</span></div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="toggleTheme()">🌓</button>
            <button id="login-nav-btn" class="btn btn-primary" onclick="showView('admin-auth')">Admin Login</button>
            <button id="logout-nav-btn" class="btn btn-danger hidden" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <section id="view-dashboard">
            <h2 style="margin-bottom: 1.5rem;">Ready to Practice?</h2>
            <div id="test-container" class="grid">
                </div>
        </section>

        <section id="view-quiz" class="hidden">
            <div class="quiz-box card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 id="quiz-title">Biology Test</h3>
                    <div id="timer" style="color: var(--danger); font-weight: bold; font-size: 1.2rem;">00:00</div>
                </div>
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
                
                <div id="question-area">
                    <p id="q-text" style="font-size: 1.2rem; margin-bottom: 1.5rem;"></p>
                    <div id="options-area"></div>
                </div>

                <div style="display: flex; justify-content: space-between; margin-top: 2rem;">
                    <button class="btn btn-outline" onclick="prevQuestion()">Previous</button>
                    <button class="btn btn-primary" onclick="nextQuestion()" id="next-btn">Next</button>
                    <button class="btn btn-danger hidden" id="submit-btn" onclick="submitQuiz()">Submit Test</button>
                </div>
            </div>
        </section>

        <section id="view-result" class="hidden">
            <div class="card result-screen">
                <h2>Analysis Report</h2>
                <div class="score-circle" id="score-display">0/0</div>
                <div id="result-details" style="margin-bottom: 2rem;"></div>
                <button class="btn btn-primary" onclick="location.reload()">Back to Dashboard</button>
            </div>
        </section>

        <section id="view-admin-auth" class="hidden">
            <div class="card" style="max-width: 400px; margin: auto;">
                <h3>Admin Secure Login</h3>
                <input type="email" id="admin-email" placeholder="Email" style="margin-top: 1rem;">
                <input type="password" id="admin-password" placeholder="Password">
                <button class="btn btn-primary" style="width: 100%;" onclick="handleLogin()">Login</button>
            </div>
        </section>

        <section id="view-admin-panel" class="hidden">
            <div class="card">
                <h2>Upload New Test</h2>
                <input type="text" id="admin-test-name" placeholder="Test Name (e.g., Unit 1: Living World)">
                <input type="number" id="admin-test-duration" placeholder="Duration in Minutes">
                
                <div class="admin-grid">
                    <div>
                        <label>Questions Box (Q1. Text A. B. C. D.)</label>
                        <textarea id="admin-q-bulk" placeholder="Q1. Cell is...&#10;A. Unit of life&#10;B. Atom&#10;C. Gas&#10;D. None"></textarea>
                    </div>
                    <div>
                        <label>Answers Box (1-A, 2-B)</label>
                        <textarea id="admin-a-bulk" placeholder="1-A&#10;2-B"></textarea>
                    </div>
                </div>
                <button class="btn btn-primary" style="margin-top: 1rem;" onclick="processAndUpload()">Generate & Upload Test</button>
            </div>

            <h2 style="margin: 2rem 0 1rem;">Manage Existing Tests</h2>
            <div id="admin-manage-list" class="grid"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB1Yk3k4LgpPLBm0hp73tMYuDEDiJaRamM",
            authDomain: "neet-genie.firebaseapp.com",
            projectId: "neet-genie",
            storageBucket: "neet-genie.firebasestorage.app",
            messagingSenderId: "91475548401",
            appId: "1:91475548401:web:f395534d6d806d52713150"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // State variables
        let currentTest = null;
        let userChoices = [];
        let currentIdx = 0;
        let timer;

        // --- Core Functions ---

        window.showView = (viewId) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
        };

        window.toggleTheme = () => document.body.classList.toggle('light-theme');

        // --- Admin Logic ---

        window.handleLogin = async () => {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert("Login Success!");
            } catch (e) { alert("Access Denied: " + e.message); }
        };

        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('login-nav-btn');
            const logoutBtn = document.getElementById('logout-nav-btn');
            if (user) {
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                showView('admin-panel');
                fetchAdminTests();
            } else {
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                showView('dashboard');
                fetchDashboardTests();
            }
        });

        window.processAndUpload = async () => {
            const name = document.getElementById('admin-test-name').value;
            const mins = document.getElementById('admin-test-duration').value;
            const qTxt = document.getElementById('admin-q-bulk').value;
            const aTxt = document.getElementById('admin-a-bulk').value;

            if(!name || !qTxt || !aTxt) return alert("Details fill karo!");

            // Parsing Logic
            const qBlocks = qTxt.split(/Q\d+\./g).filter(b => b.trim() !== "");
            const questions = qBlocks.map((block, i) => {
                const lines = block.split('\n').filter(l => l.trim() !== "");
                const qBody = lines[0].trim();
                const opts = lines.slice(1, 5).map(o => o.replace(/^[A-D]\.\s*/, "").trim());
                const ansMatch = aTxt.match(new RegExp(`${i+1}-([A-D])`));
                return {
                    question: qBody,
                    options: opts,
                    answer: ansMatch ? ansMatch[1] : "A"
                };
            });

            await addDoc(collection(db, "tests"), {
                testName: name,
                duration: parseInt(mins),
                questions: questions,
                createdAt: Date.now()
            });

            alert("Test Live Ho Gya!");
            location.reload();
        };

        // --- User/Student Logic ---

        async function fetchDashboardTests() {
            const snap = await getDocs(query(collection(db, "tests"), orderBy("createdAt", "desc")));
            const container = document.getElementById('test-container');
            container.innerHTML = "";
            snap.forEach(docSnap => {
                const test = docSnap.data();
                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <h3>${test.testName}</h3>
                    <p>⏱ ${test.duration} Minutes</p>
                    <p>📝 ${test.questions.length} MCQs</p>
                    <button class="btn btn-primary" style="width:100%; margin-top:1rem;" onclick="initQuiz('${docSnap.id}')">Start Now</button>
                `;
                container.appendChild(card);
            });
        }

        window.initQuiz = async (id) => {
            const allTests = await getDocs(collection(db, "tests"));
            const testDoc = allTests.docs.find(d => d.id === id);
            currentTest = testDoc.data();
            userChoices = new Array(currentTest.questions.length).fill(null);
            currentIdx = 0;
            showView('quiz-view');
            startTimer(currentTest.duration);
            renderQuestion();
        };

        function renderQuestion() {
            const q = currentTest.questions[currentIdx];
            document.getElementById('q-text').innerText = `${currentIdx + 1}. ${q.question}`;
            const optArea = document.getElementById('options-area');
            optArea.innerHTML = "";
            
            ["A","B","C","D"].forEach((label, i) => {
                const btn = document.createElement('button');
                btn.className = `option ${userChoices[currentIdx] === label ? 'selected' : ''}`;
                btn.innerText = `${label}. ${q.options[i]}`;
                btn.onclick = () => {
                    userChoices[currentIdx] = label;
                    new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3').play();
                    renderQuestion();
                };
                optArea.appendChild(btn);
            });

            document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / currentTest.questions.length) * 100}%`;
            
            document.getElementById('next-btn').classList.toggle('hidden', currentIdx === currentTest.questions.length - 1);
            document.getElementById('submit-btn').classList.toggle('hidden', currentIdx !== currentTest.questions.length - 1);
        }

        window.nextQuestion = () => { currentIdx++; renderQuestion(); };
        window.prevQuestion = () => { if(currentIdx > 0) { currentIdx--; renderQuestion(); } };

        function startTimer(mins) {
            let time = mins * 60;
            clearInterval(timer);
            timer = setInterval(() => {
                let m = Math.floor(time / 60);
                let s = time % 60;
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if (time <= 0) { clearInterval(timer); submitQuiz(); }
                time--;
            }, 1000);
        }

        window.submitQuiz = () => {
            clearInterval(timer);
            let score = 0;
            currentTest.questions.forEach((q, i) => {
                if(userChoices[i] === q.answer) score++;
            });
            
            showView('result');
            document.getElementById('score-display').innerText = `${score} / ${currentTest.questions.length}`;
        };

        async function fetchAdminTests() {
            const snap = await getDocs(collection(db, "tests"));
            const list = document.getElementById('admin-manage-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const div = document.createElement('div');
                div.className = "card";
                div.innerHTML = `<h4>${d.data().testName}</h4><button class="btn btn-danger" style="margin-top:10px" onclick="deleteTest('${d.id}')">Delete</button>`;
                list.appendChild(div);
            });
        }

        window.deleteTest = async (id) => {
            if(confirm("Pakka delete kardu?")) {
                await deleteDoc(doc(db, "tests", id));
                location.reload();
            }
        }
    </script>
</body>
</html>
