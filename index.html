<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie Ultra - Pro Cloud</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg: #0b0f1a; --card: #161b22; --accent: #58a6ff; --text: #c9d1d9; --success: #238636; --error: #da3633; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 850px; margin: auto; }
        .card { background: var(--card); border: 1px solid #30363d; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { color: var(--accent); margin-top: 0; }
        textarea, input { width: 100%; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn:hover { filter: brightness(1.2); }
        #timerDisplay { font-size: 3.5rem; text-align: center; color: #ff7b72; font-family: monospace; margin: 15px 0; background: #0d1117; border-radius: 10px; }
        .q-display { font-size: 1.4rem; padding: 20px; background: #21262d; border-radius: 10px; border-left: 6px solid var(--accent); min-height: 80px; }
        .score-board { font-size: 1.5rem; color: var(--accent); text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="setupArea" class="card">
        <h2>🧬 Create Mock Test</h2>
        <input type="text" id="testTitle" placeholder="Batch/Subject Name">
        
        <label>Enter Questions (One per line):</label>
        <textarea id="questionsInput" rows="6" placeholder="Q1. Force unit?&#10;Q2. Speed of light?"></textarea>
        
        <label>Enter Answers (Same order - One per line):</label>
        <textarea id="answersInput" rows="6" placeholder="Newton&#10;3x10^8"></textarea>
        
        <label>Set Timer (Minutes):</label>
        <input type="number" id="timeLimit" value="45">
        
        <button class="btn" onclick="startProQuiz()">Start Quiz 🚀</button>
    </div>

    <div id="quizArea" class="card" style="display:none;">
        <div id="timerDisplay">00:00</div>
        <div id="qDisplay" class="q-display"></div>
        <input type="text" id="userInput" placeholder="Your Answer here..." style="margin-top:20px;">
        
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn" onclick="checkAndNext()" style="background: var(--accent);">Next Question ➡️</button>
            <button class="btn" onclick="forceQuit()" style="background: var(--error);">End Early</button>
        </div>
        <p id="progress" style="text-align:right; margin-top:10px; color:#8b949e;"></p>
    </div>

    <div id="resultArea" class="card" style="display:none;">
        <h2>📊 Test Results</h2>
        <div class="score-board" id="finalScore"></div>
        <button class="btn" onclick="location.reload()" style="margin-top:20px;">Try Another Test</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB1Yk3k4LgpPLBm0hp73tMYuDEDiJaRamM",
        authDomain: "neet-genie.firebaseapp.com",
        projectId: "neet-genie",
        storageBucket: "neet-genie.firebasestorage.app",
        messagingSenderId: "91475548401",
        appId: "1:91475548401:web:f395534d6d806d52713150"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let qList = [], aList = [], uAnswers = [];
    let currentIdx = 0, timerRef, score = 0;

    async function startProQuiz() {
        const title = document.getElementById('testTitle').value;
        const qRaw = document.getElementById('questionsInput').value.trim();
        const aRaw = document.getElementById('answersInput').value.trim();
        const mins = document.getElementById('timeLimit').value;

        if(!title || !qRaw || !aRaw) return alert("Pura data bharo bhai!");

        qList = qRaw.split('\n').filter(l => l.trim() !== "");
        aList = aRaw.split('\n').filter(l => l.trim() !== "");
        
        if(qList.length !== aList.length) return alert("Warning: Questions aur Answers ki ginti barabar nahi hai!");

        // Cloud Backup
        await db.collection("pro_tests").add({
            testName: title,
            qCount: qList.length,
            timeSet: mins,
            timestamp: new Date()
        });

        document.getElementById('setupArea').style.display = "none";
        document.getElementById('quizArea').style.display = "block";
        
        runTimer(mins * 60);
        renderQuestion();
    }

    function renderQuestion() {
        if(currentIdx < qList.length) {
            document.getElementById('qDisplay').innerText = `Q${currentIdx + 1}: ${qList[currentIdx]}`;
            document.getElementById('userInput').value = "";
            document.getElementById('progress').innerText = `Question ${currentIdx+1} of ${qList.length}`;
            document.getElementById('userInput').focus();
        } else {
            showFinalResults();
        }
    }

    function checkAndNext() {
        let userAns = document.getElementById('userInput').value.trim().toLowerCase();
        let correctAns = aList[currentIdx].trim().toLowerCase();

        if(userAns === correctAns) score++;
        
        currentIdx++;
        renderQuestion();
    }

    function runTimer(sec) {
        timerRef = setInterval(() => {
            let m = Math.floor(sec / 60), s = sec % 60;
            document.getElementById('timerDisplay').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            if(sec <= 0) { clearInterval(timerRef); showFinalResults(); }
            sec--;
        }, 1000);
    }

    function showFinalResults() {
        clearInterval(timerRef);
        document.getElementById('quizArea').style.display = "none";
        document.getElementById('resultArea').style.display = "block";
        document.getElementById('finalScore').innerHTML = `Aapne <b>${qList.length}</b> mein se <b>${score}</b> sahi kiye! <br> Accuracy: ${Math.round((score/qList.length)*100)}%`;
    }

    function forceQuit() { if(confirm("Khatam karna hai?")) showFinalResults(); }
</script>
</body>
</html>
