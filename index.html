<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEET Test Platform</title><!-- Google Font --><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"><!-- Firebase --><script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:#fff;
min-height:100vh;
overflow-x:hidden;
}
.hidden{display:none;}

/* SPLASH */
#splash{
position:fixed;inset:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
#splash h1{
font-size:28px;
font-weight:700;
letter-spacing:1px;
animation:zoom 2s ease-in-out;
}
@keyframes zoom{
0%{transform:scale(0.6);opacity:0}
100%{transform:scale(1);opacity:1}
}

/* HEADER */
header{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:15px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.container{padding:20px;}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
padding:15px;
border-radius:14px;
transition:0.3s;
border:1px solid rgba(255,255,255,0.08);
}
.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
background:linear-gradient(45deg,#3b82f6,#6366f1);
color:#fff;
font-weight:600;
transition:0.3s;
}
button:hover{transform:scale(1.05)}

/* ADMIN BUTTON */
.admin-btn{
position:fixed;
bottom:20px;
right:20px;
width:55px;
height:55px;
border-radius:50%;
background:#ef4444;
font-weight:700;
}

/* INPUT */
input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:none;
background:rgba(255,255,255,0.08);
color:#fff;
outline:none;
}

/* QUESTION CARD */
.question{
background:rgba(255,255,255,0.06);
padding:15px;
border-radius:12px;
margin-bottom:10px;
}

.timer{
font-size:18px;
margin:10px 0;
color:#22c55e;
}

</style></head>
<body><!-- SPLASH --><div id="splash">
<h1>Made by Abhishek Sanetiya</h1>
</div><!-- HOME --><div id="home" class="hidden">
<header><h2>NEET Test Portal</h2></header>
<div class="container">
<div id="testList" class="grid"></div>
</div>
</div><!-- ADMIN PANEL (NO LOGIN - TEST MODE) --><div id="adminPanel" class="hidden container">
<h2>Admin Dashboard (Test Mode)</h2><input id="testName" placeholder="Test Name" />
<input id="testTime" placeholder="Time (minutes)" />
<textarea id="questions" placeholder="Paste Questions"></textarea>
<textarea id="answers" placeholder="Paste Answers"></textarea>
<button onclick="generateTest()">Generate Test</button>
</div><!-- TEST SCREEN --><div id="testScreen" class="hidden container">
<h2 id="tName"></h2>
<div class="timer" id="timer"></div>
<div id="qBox"></div>
<div style="margin-top:10px">
<button onclick="prevQ()">Previous</button>
<button onclick="nextQ()">Next</button>
<button onclick="submitTest()">Submit</button>
</div>
</div><script>
// FIREBASE CONFIG
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID",
storageBucket: "YOUR_BUCKET",
messagingSenderId: "YOUR_ID",
appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let tests=[];
let currentTest=null;
let qIndex=0;
let score=0;
let timeLeft=0;
let timer;

// SPLASH
setTimeout(()=>{
 document.getElementById("splash").style.display="none";
 document.getElementById("home").classList.remove("hidden");
 loadTests();
},2500);

// LOAD TESTS
async function loadTests(){
 const snap=await db.collection("tests").get();
 tests=[];
 snap.forEach(doc=>tests.push({id:doc.id,...doc.data()}));
 renderTests();
}

function renderTests(){
 let html="";
 tests.forEach(t=>{
 html+=`<div class='card'>
 <h3>${t.name}</h3>
 <p>${t.time} min</p>
 <button onclick="startTest('${t.id}')">Start Test</button>
 </div>`;
 });
 document.getElementById("testList").innerHTML=html;
}

// OPEN ADMIN DIRECT (NO LOCK)
let adminOpen=false;
document.addEventListener("keydown",e=>{
 if(e.key=="A"||e.key=="a"){
 adminOpen=!adminOpen;
 document.getElementById("adminPanel").classList.toggle("hidden");
 document.getElementById("home").classList.toggle("hidden");
 }
});

// GENERATE TEST
async function generateTest(){
 let name=document.getElementById("testName").value;
 let time=document.getElementById("testTime").value;
 let q=document.getElementById("questions").value.split("\n");
 let a=document.getElementById("answers").value.split("\n");

 let questions=[];
 for(let i=0;i<q.length;i++){
 questions.push({q:q[i],a:a[i]||""});
 }

 await db.collection("tests").add({name,time,questions});
 alert("Test Generated Successfully");
 loadTests();
}

// START TEST
function startTest(id){
 currentTest=tests.find(t=>t.id==id);
 qIndex=0;
 score=0;
 timeLeft=currentTest.time*60;

 document.getElementById("home").classList.add("hidden");
 document.getElementById("testScreen").classList.remove("hidden");
 document.getElementById("tName").innerText=currentTest.name;

 startTimer();
 renderQ();
}

function startTimer(){
 timer=setInterval(()=>{
 timeLeft--;
 document.getElementById("timer").innerText="Time Left: "+timeLeft+" sec";
 if(timeLeft<=0)submitTest();
 },1000);
}

function renderQ(){
 let q=currentTest.questions[qIndex];
 document.getElementById("qBox").innerHTML=`
 <div class='question'>
 <h3>Q${qIndex+1}. ${q.q}</h3>
 <input id='ans' placeholder='Type answer here'>
 </div>`;
}

function nextQ(){qIndex++;renderQ();}
function prevQ(){qIndex--;renderQ();}

function submitTest(){
 clearInterval(timer);
 let ans=document.getElementById("ans").value;
 currentTest.questions.forEach(q=>{
 if(q.a.toLowerCase()==ans.toLowerCase())score++;
 });
 alert("Your Score: "+score);
 location.reload();
}

// ADMIN BUTTON
let btn=document.createElement("button");
btn.innerText="A";
btn.className="admin-btn";
btn.onclick=()=>{
document.getElementById("adminPanel").classList.remove("hidden");
document.getElementById("home").classList.add("hidden");
};
document.body.appendChild(btn);

</script></body>
</html>
