<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie 🩺 | Exam Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    
    <style>
        :root { --p: #2563eb; --bg: #f1f5f9; --w: #ffffff; --border: #e2e8f0; --d: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; min-height: 100vh; }

        /* AUTH SCREEN */
        #auth-overlay { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 100%; max-width: 380px; padding: 40px; text-align: center; border-radius: 24px; background: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .tab-btn { padding: 10px 20px; cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; display: inline-block; margin-bottom: 20px; }
        .tab-btn.active { color: var(--p); border-color: var(--p); }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1.5px solid var(--border); border-radius: 12px; outline: none; box-sizing: border-box; }

        /* APP LAYOUT */
        .sidebar { width: 280px; background: #fff; border-right: 1px solid var(--border); padding: 40px 24px; position: fixed; height: 100vh; display: none; }
        .main-content { margin-left: 280px; flex: 1; padding: 40px; display: none; }
        
        /* TIMER BOX */
        #timer-display { font-size: 1.8rem; font-weight: 800; color: var(--d); background: #fee2e2; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px; border: 2px solid #fecaca; }

        .btn { padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; }
        .hidden { display: none !important; }
        
        /* QUIZ STYLES */
        .opt-btn { display: block; width: 100%; text-align: left; padding: 15px; margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; background: white; cursor: pointer; }
        .opt-btn:hover { background: #f8fafc; }
        .opt-btn.selected { background: var(--p); color: white; border-color: var(--p); }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h1>Genie 🩺</h1>
            <div style="margin-bottom: 20px;">
                <span id="tab-login" class="tab-btn active" onclick="toggleAuthMode('login')">Login</span>
                <span id="tab-signup" class="tab-btn" onclick="toggleAuthMode('signup')">New Account</span>
            </div>
            <div id="auth-msg" style="color:red; margin-bottom:10px; font-size:0.8rem;"></div>
            <input type="text" id="user-fullname" class="auth-input hidden" placeholder="Full Name">
            <input type="email" id="user-email" class="auth-input" placeholder="Email Address">
            <input type="password" id="user-pass" class="auth-input" placeholder="Password">
            <button id="auth-main-btn" class="btn btn-p" onclick="processAuth()">Login</button>
        </div>
    </div>

    <nav class="sidebar" id="sidebar">
        <h2 style="color:var(--p); text-align:center;">Genie 🩺</h2>
        <div style="margin-top:40px;">
            <p id="display-name" style="font-weight:800; font-size:1.2rem; color:var(--p);"></p>
            <hr border="0" height="1px" background="#eee">
            <p onclick="location.reload()" style="cursor:pointer;">🏠 Dashboard</p>
        </div>
        <button class="btn" style="position:absolute; bottom:30px; background:#fee2e2; color:red;" onclick="auth.signOut()">Logout</button>
    </nav>

    <main class="main-content" id="main-content">
        <div id="v-dash">
            <h1>Live Mock Tests</h1>
            <div id="test-list">Loading tests...</div>
        </div>

        <div id="v-quiz" class="hidden">
            <div id="timer-display">0 hrs 00 min 00 sec</div>
            <div id="question-container" class="card" style="background:white; padding:30px; border-radius:20px; border:1px solid #ddd;">
                </div>
            <button class="btn btn-p" style="margin-top:20px; background:var(--d);" onclick="finishTest()">Submit Quiz</button>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB1Yk3k4LgpPLBm0hp73tMYuDEDiJaRamM",
            authDomain: "neet-genie.firebaseapp.com",
            projectId: "neet-genie",
            storageBucket: "neet-genie.firebasestorage.app",
            messagingSenderId: "91475548401",
            appId: "1:91475548401:web:f395534d6d806d52713150"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let state = { user: null, tests: [], activeT: null, timer: null, answers: {} };
        let isLoginMode = true;

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        function toggleAuthMode(mode) {
            isLoginMode = (mode === 'login');
            document.getElementById('tab-login').className = isLoginMode ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-signup').className = isLoginMode ? 'tab-btn' : 'tab-btn active';
            document.getElementById('user-fullname').classList.toggle('hidden', isLoginMode);
            document.getElementById('auth-main-btn').innerText = isLoginMode ? 'Login' : 'Create Account';
        }

        async function processAuth() {
            const email = document.getElementById('user-email').value;
            const pass = document.getElementById('user-pass').value;
            const name = document.getElementById('user-fullname').value;
            try {
                if (isLoginMode) await auth.signInWithEmailAndPassword(email, pass);
                else {
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.collection("users").doc(res.user.uid).set({ name, email });
                }
            } catch (e) { document.getElementById('auth-msg').innerText = e.message; }
        }

        auth.onAuthStateChanged(async (u) => {
            if (u) {
                const doc = await db.collection("users").doc(u.uid).get();
                state.user = doc.data();
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('sidebar').style.display = 'block';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('display-name').innerText = "Dr. " + state.user.name;
                loadTests();
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });

        async function loadTests() {
            const snap = await db.collection("global_tests").get();
            state.tests = snap.docs.map(d => ({id: d.id, ...d.data()}));
            document.getElementById('test-list').innerHTML = state.tests.map((t, i) => `
                <div style="background:white; padding:20px; border-radius:15px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; border:1px solid #eee;">
                    <div><b>${t.name}</b><br><small>${t.mins} Mins | ${t.qs.length} Questions</small></div>
                    <button class="btn btn-p" style="width:120px;" onclick="startQuiz(${i})">Start Test</button>
                </div>
            `).join('');
        }

        function startQuiz(idx) {
            state.activeT = state.tests[idx];
            document.getElementById('v-dash').classList.add('hidden');
            document.getElementById('v-quiz').classList.remove('hidden');
            
            // --- ACCURATE TIMER LOGIC ---
            let totalSeconds = state.activeT.mins * 60;
            state.timer = setInterval(() => {
                totalSeconds--;
                if(totalSeconds <= 0) finishTest();

                let h = Math.floor(totalSeconds / 3600);
                let m = Math.floor((totalSeconds % 3600) / 60);
                let s = totalSeconds % 60;

                document.getElementById('timer-display').innerText = 
                    `${h} hrs ${m < 10 ? '0'+m : m} min ${s < 10 ? '0'+s : s} sec`;
            }, 1000);

            renderQuestion(0);
        }

        function renderQuestion(qIdx) {
            const q = state.activeT.qs[qIdx];
            let html = `<h3>Q. ${q.txt}</h3>`;
            ['A','B','C','D'].forEach(opt => {
                html += `<button class="opt-btn" onclick="this.classList.add('selected')">${opt}. ${q[opt]}</button>`;
            });
            document.getElementById('question-container').innerHTML = html;
        }

        function finishTest() {
            clearInterval(state.timer);
            alert("Test Submitted Successfully!");
            location.reload();
        }
    </script>
</body>
</html>
