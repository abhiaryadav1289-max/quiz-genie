<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Genie - NEET Ready</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --dark: #1e293b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; color: var(--dark); }
        
        .header { background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; }
        .header h1 { font-size: 18px; margin: 0; color: var(--primary); }
        #timer { font-weight: bold; font-size: 18px; color: #dc2626; background: #fee2e2; padding: 5px 10px; border-radius: 8px; }

        .container { flex: 1; overflow-y: auto; padding: 20px; }
        
        /* Input Screen */
        textarea { width: 100%; height: 60vh; border: 2px solid #cbd5e1; border-radius: 12px; padding: 15px; font-size: 14px; margin-bottom: 15px; resize: none; }
        
        /* Quiz Card */
        .q-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .q-text { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
        
        .opt { display: flex; align-items: center; width: 100%; padding: 15px; margin-bottom: 10px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; cursor: pointer; text-align: left; font-size: 16px; }
        .opt:active { background: #f1f5f9; }
        .opt.selected { border-color: var(--primary); background: #eff6ff; border-width: 2px; }
        .opt-circle { width: 24px; height: 24px; border: 2px solid #cbd5e1; border-radius: 50%; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .selected .opt-circle { background: var(--primary); border-color: var(--primary); color: white; }

        .footer { padding: 15px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-p { background: var(--primary); color: white; }
        .btn-s { background: #e2e8f0; color: var(--dark); }

        .result { text-align: center; }
        .score-box { font-size: 48px; font-weight: 800; color: var(--primary); margin: 20px 0; }
    </style>
</head>
<body>

<div class="header">
    <h1>Genie Quiz <span id="qCount"></span></h1>
    <div id="timer" style="display:none">30:00</div>
</div>

<div class="container" id="main">
    <div id="inputBox">
        <p><b>NEET Format:</b> Har question ke baad options aur fir 'Ans: A' likhein. Ek question ke baad ek line ka space chodein.</p>
        <textarea id="rawText" placeholder="Q1. Example Question?
A) Option 1
B) Option 2
C) Option 3
D) Option 4
Ans: A"></textarea>
        <button class="btn btn-p" style="width:100%" onclick="init()">Generate NEET Quiz</button>
    </div>

    <div id="quizBox" style="display:none">
        <div class="q-card" id="qContainer"></div>
    </div>

    <div id="resultBox" style="display:none" class="result"></div>
</div>

<div class="footer" id="controls" style="display:none">
    <button class="btn btn-s" onclick="move(-1)">Back</button>
    <button class="btn btn-p" id="nextBtn" onclick="move(1)">Next</button>
</div>

<script>
    let questions = [], answers = [], current = 0, time = 1800, timerId;

    function init() {
        const text = document.getElementById("rawText").value.trim();
        // Improved Parsing Logic
        const blocks = text.split(/\n\s*\n/);
        questions = blocks.map(b => {
            const lines = b.split("\n").map(l => l.trim()).filter(l => l);
            if (lines.length >= 6) {
                return {
                    q: lines[0],
                    o: lines.slice(1, 5),
                    a: lines[5].split(":")[1]?.trim().toUpperCase()
                };
            }
        }).filter(x => x && x.a);

        if (questions.length === 0) return alert("Error: Questions detect nahi huye. Format sahi karein!");

        answers = new Array(questions.length).fill(null);
        document.getElementById("inputBox").style.display = "none";
        document.getElementById("quizBox").style.display = "block";
        document.getElementById("controls").style.display = "flex";
        document.getElementById("timer").style.display = "block";
        
        startTimer();
        render();
    }

    function startTimer() {
        timerId = setInterval(() => {
            time--;
            let m = Math.floor(time / 60), s = time % 60;
            document.getElementById("timer").innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if (time <= 0) end();
        }, 1000);
    }

    function render() {
        const item = questions[current];
        document.getElementById("qCount").innerText = `(${current + 1}/${questions.length})`;
        document.getElementById("nextBtn").innerText = current === questions.length - 1 ? "Finish" : "Next";
        
        let html = `<div class="q-text">${item.q}</div>`;
        ["A", "B", "C", "D"].forEach((l, i) => {
            const sel = answers[current] === l ? 'selected' : '';
            html += `<div class="opt ${sel}" onclick="setAns('${l}')">
                <div class="opt-circle">${l}</div> ${item.o[i]}
            </div>`;
        });
        document.getElementById("qContainer").innerHTML = html;
    }

    function setAns(val) { answers[current] = val; render(); }

    function move(step) {
        if (step === 1 && current === questions.length - 1) return end();
        if (step === -1 && current === 0) return;
        current += step;
        render();
    }

    function end() {
        clearInterval(timerId);
        let score = 0, c = 0, w = 0;
        questions.forEach((q, i) => {
            if (answers[i] === q.a) { score += 4; c++; }
            else if (answers[i]) { score -= 1; w++; }
        });

        document.getElementById("quizBox").style.display = "none";
        document.getElementById("controls").style.display = "none";
        document.getElementById("timer").style.display = "none";
        const res = document.getElementById("resultBox");
        res.style.display = "block";
        res.innerHTML = `
            <h2>Result Summary</h2>
            <div class="score-box">${score}</div>
            <p>Correct: <b style="color:green">${c}</b> | Wrong: <b style="color:red">${w}</b></p>
            <button class="btn btn-p" onclick="location.reload()">Reset Quiz</button>
        `;
    }
</script>

</body>
</html>
