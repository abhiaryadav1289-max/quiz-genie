<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie | Master Portal</title>
    <style>
        :root {
            --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --primary: #38bdf8;
            --accent: #818cf8; --text: #f1f5f9; --danger: #f43f5e; --glass: rgba(255, 255, 255, 0.05);
        }
        .light-theme { --bg: #f8fafc; --card: rgba(255, 255, 255, 0.9); --text: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        nav { display: flex; justify-content: space-between; padding: 1rem 5%; background: var(--glass); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .option { display: block; width: 100%; padding: 1rem; margin: 0.5rem 0; background: var(--glass); border: 2px solid transparent; border-radius: 10px; text-align: left; cursor: pointer; color: inherit; }
        .option.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.1); }
        .progress-bar { width: 100%; height: 8px; background: var(--glass); border-radius: 10px; margin: 1rem 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
        textarea { width: 100%; height: 150px; background: var(--glass); color: var(--text); border-radius: 8px; padding: 10px; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: var(--glass); color: var(--text); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">NEET<span>Genie</span></div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-outline" onclick="location.reload()">Home</button>
            <button id="admin-btn" class="btn btn-primary" onclick="checkAuth()">Admin Panel</button>
        </div>
    </nav>

    <div class="container">
        <section id="view-dashboard">
            <h2>Available Tests</h2>
            <div id="test-list" class="grid" style="margin-top:1.5rem;">Loading tests...</div>
        </section>

        <section id="view-quiz" class="hidden">
            <div class="card">
                <div style="display:flex; justify-content:space-between;">
                    <h3 id="q-title">Quiz</h3>
                    <div id="timer" style="color:var(--danger); font-weight:bold;">00:00</div>
                </div>
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
                <p id="q-text" style="font-size:1.2rem; margin:1.5rem 0;"></p>
                <div id="options-area"></div>
                <div style="display:flex; justify-content:space-between; margin-top:20px;">
                    <button class="btn btn-outline" onclick="changeQ(-1)">Previous</button>
                    <button class="btn btn-primary" id="next-btn" onclick="changeQ(1)">Next</button>
                    <button class="btn btn-primary hidden" id="submit-btn" onclick="finishQuiz()">Submit</button>
                </div>
            </div>
        </section>

        <section id="view-auth" class="hidden">
            <div class="card" style="max-width:400px; margin:auto;">
                <h3>Admin Login</h3>
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="pass" placeholder="Password">
                <button class="btn btn-primary" style="width:100%" onclick="login()">Login</button>
            </div>
        </section>

        <section id="view-admin" class="hidden">
            <div class="card">
                <h2>Upload Test</h2>
                <input type="text" id="t-name" placeholder="Test Name">
                <input type="number" id="t-time" placeholder="Time (Minutes)">
                <textarea id="t-qs" placeholder="Q1. Question?&#10;A. Opt1&#10;B. Opt2..."></textarea>
                <textarea id="t-as" placeholder="1-A&#10;2-B"></textarea>
                <button class="btn btn-primary" style="margin-top:10px" onclick="upload()">Upload Now</button>
            </div>
        </section>

        <section id="view-result" class="hidden">
            <div class="card" style="text-align:center;">
                <h2>Test Completed!</h2>
                <h1 id="final-score" style="font-size:3rem; color:var(--primary); margin:20px 0;">0</h1>
                <button class="btn btn-primary" onclick="location.reload()">Restart</button>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1Yk3k4LgpPLBm0hp73tMYuDEDiJaRamM",
            authDomain: "neet-genie.firebaseapp.com",
            projectId: "neet-genie",
            storageBucket: "neet-genie.firebasestorage.app",
            messagingSenderId: "91475548401",
            appId: "1:91475548401:web:f395534d6d806d52713150"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let activeTest = null;
        let userAns = [];
        let index = 0;
        let clock;

        window.show = (id) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('view-' + id).classList.remove('hidden');
        };

        // --- DASHBOARD ---
        async function loadTests() {
            const snap = await getDocs(collection(db, "tests"));
            const list = document.getElementById('test-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                const div = document.createElement('div');
                div.className = "card";
                div.innerHTML = `
                    <h3>${data.testName}</h3>
                    <p>${data.questions.length} Questions | ${data.duration} Min</p>
                    <button class="btn btn-primary" style="width:100%; margin-top:10px" id="btn-${d.id}">Start Test</button>
                `;
                list.appendChild(div);
                document.getElementById(`btn-${d.id}`).onclick = () => start(data);
            });
        }
        loadTests();

        // --- QUIZ LOGIC ---
        function start(test) {
            activeTest = test;
            userAns = new Array(test.questions.length).fill(null);
            index = 0;
            show('quiz');
            render();
            let time = test.duration * 60;
            clock = setInterval(() => {
                let m = Math.floor(time/60), s = time%60;
                document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
                if(time <= 0) { clearInterval(clock); finishQuiz(); }
                time--;
            }, 1000);
        }

        function render() {
            const q = activeTest.questions[index];
            document.getElementById('q-title').innerText = activeTest.testName;
            document.getElementById('q-text').innerText = `${index+1}. ${q.question}`;
            const area = document.getElementById('options-area');
            area.innerHTML = "";
            ["A","B","C","D"].forEach((l, i) => {
                const b = document.createElement('button');
                b.className = `option ${userAns[index] === l ? 'selected' : ''}`;
                b.innerText = `${l}. ${q.options[i]}`;
                b.onclick = () => { userAns[index] = l; render(); };
                area.appendChild(b);
            });
            document.getElementById('progress-fill').style.width = `${((index+1)/activeTest.questions.length)*100}%`;
            document.getElementById('next-btn').classList.toggle('hidden', index === activeTest.questions.length-1);
            document.getElementById('submit-btn').classList.toggle('hidden', index !== activeTest.questions.length-1);
        }

        window.changeQ = (n) => { index += n; if(index >=0 && index < activeTest.questions.length) render(); };

        window.finishQuiz = () => {
            clearInterval(clock);
            let score = 0;
            activeTest.questions.forEach((q, i) => { if(userAns[i] === q.answer) score++; });
            show('result');
            document.getElementById('final-score').innerText = `${score} / ${activeTest.questions.length}`;
        };

        // --- ADMIN ---
        window.checkAuth = () => { if(auth.currentUser) show('admin'); else show('auth'); };
        window.login = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value)
            .then(() => show('admin')).catch(e => alert(e.message));
        };

        window.upload = async () => {
            const name = document.getElementById('t-name').value;
            const time = document.getElementById('t-time').value;
            const qRaw = document.getElementById('t-qs').value;
            const aRaw = document.getElementById('t-as').value;

            const qBlocks = qRaw.split(/Q\d+\./g).filter(b => b.trim() !== "");
            const questions = qBlocks.map((b, i) => {
                const lines = b.split('\n').filter(l => l.trim() !== "");
                return {
                    question: lines[0],
                    options: lines.slice(1,5).map(o => o.replace(/^[A-D]\.\s*/, "")),
                    answer: (aRaw.match(new RegExp(`${i+1}-([A-D])`)) || [])[1] || "A"
                };
            });

            await addDoc(collection(db, "tests"), { testName: name, duration: parseInt(time), questions, createdAt: Date.now() });
            alert("Test Uploaded!"); location.reload();
        };
    </script>
</body>
</html>
