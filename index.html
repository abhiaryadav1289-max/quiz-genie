<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie | AI & Cloud Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --s: #10b981; --d: #ef4444; --bg: #f8fafc; --sur: #ffffff; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; color: #1e293b; }
        header { background: #1e1b4b; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: var(--sur); padding: 1.5rem; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        
        /* Quiz Styles */
        .option { padding: 1rem; border: 1.5px solid #e2e8f0; border-radius: 12px; margin-bottom: 0.8rem; cursor: pointer; transition: 0.2s; }
        .option.selected { background: #eef2ff; border-color: var(--p); color: var(--p); }
        .option.correct { background: #dcfce7; border-color: var(--s); color: #166534; }
        .option.wrong { background: #fee2e2; border-color: var(--d); color: #991b1b; }
        
        /* Analysis Mode */
        .ai-box { margin-top: 1rem; padding: 1rem; background: #f0fdf4; border-radius: 12px; border: 1px solid #dcfce7; }
        .ncert-hint { color: #b45309; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        /* Buttons */
        .btn { padding: 0.8rem 1.5rem; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; width: 100%; margin-top: 10px; }
        .btn-ai { background: #000; color: #fff; font-size: 0.8rem; margin-top: 10px; display: inline-flex; align-items: center; gap: 5px; }
        
        .test-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        .sync-bar { background: #eef2ff; padding: 10px; border-radius: 10px; font-size: 0.8rem; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="location.reload()" style="cursor:pointer">NEET GENIE AI</div>
    <div id="timer">00:00</div>
</header>

<div class="container" id="dash">
    <div class="sync-bar">
        <span><b>Device Sync:</b> Local Storage Active</span>
        <button class="btn" style="padding: 5px 10px; font-size: 10px;" onclick="exportAll()">Get Sync Code</button>
    </div>

    <div class="card">
        <h3 style="margin-top:0">Upload New Test</h3>
        <input type="text" id="t-name" placeholder="Test Name (e.g. Bio-NCERT Ch.1)">
        <textarea id="t-qs" rows="4" placeholder="Paste Qns (Q1. Text... A.. B.. C.. D..)"></textarea>
        <textarea id="t-ans" rows="2" placeholder="Keys (1 A | 2 C | 3 B...)"></textarea>
        <button class="btn btn-p" onclick="saveTest()">Add to My Library</button>
        <button class="btn" style="width:100%; margin-top:5px; background:#f1f5f9" onclick="importTest()">Import from Other Phone</button>
    </div>

    <h3>My Saved Tests</h3>
    <div class="test-list" id="test-list"></div>
</div>

<div class="container" id="quiz" style="display:none">
    <div class="card">
        <div id="q-content"></div>
        <div style="display:flex; gap:10px; margin-top:1.5rem">
            <button class="btn" style="background:#e2e8f0; flex:1" onclick="move(-1)">Back</button>
            <button class="btn" style="background:#e2e8f0; flex:1" onclick="move(1)">Next</button>
            <button class="btn btn-p" id="sub-btn" style="flex:2" onclick="finish()">Submit Exam</button>
        </div>
    </div>
</div>

<div class="container" id="result" style="display:none"></div>

<script>
    let library = JSON.parse(localStorage.getItem('genie_sync')) || [];
    let state = { t: null, ans: {}, idx: 0, mode: 'exam' };

    function saveTest() {
        const name = document.getElementById('t-name').value || "NEET Test";
        const qRaw = document.getElementById('t-qs').value;
        const aRaw = document.getElementById('t-ans').value;
        
        const blocks = qRaw.split(/Q\d+\./).filter(b => b.trim());
        const qs = blocks.map((b, i) => {
            const lines = b.trim().split('\n').filter(l => l.trim());
            const keyMatch = aRaw.match(new RegExp(`${i+1}\\s*([A-D])`));
            return {
                txt: lines[0],
                opts: lines.slice(1, 5),
                key: keyMatch ? keyMatch[1] : 'A'
            };
        });

        if(!qs.length) return alert("Pehle questions toh daalo bhai!");
        library.push({ id: Date.now(), name, qs });
        localStorage.setItem('genie_sync', JSON.stringify(library));
        location.reload();
    }

    function renderDash() {
        const list = document.getElementById('test-list');
        list.innerHTML = library.map((t, i) => `
            <div class="card" style="margin-bottom:0">
                <h4 style="margin:0">${t.name}</h4>
                <p style="font-size:0.8rem; color:#64748b">${t.qs.length} Qns</p>
                <button class="btn btn-p" onclick="start(${i})">Start Test</button>
            </div>
        `).join('');
    }

    function start(idx, mode = 'exam') {
        state.t = library[idx]; state.mode = mode; state.idx = 0;
        document.getElementById('dash').style.display = 'none';
        document.getElementById('quiz').style.display = 'block';
        document.getElementById('sub-btn').style.display = mode === 'exam' ? 'block' : 'none';
        renderQ();
    }

    function renderQ() {
        const q = state.t.qs[state.idx];
        let html = `<h2>Q${state.idx+1}. ${q.txt}</h2>`;
        ["A", "B", "C", "D"].forEach((l, i) => {
            let cls = 'option';
            if(state.mode === 'exam') { if(state.ans[state.idx] === l) cls += ' selected'; }
            else {
                if(l === q.key) cls += ' correct';
                if(state.ans[state.idx] === l && l !== q.key) cls += ' wrong';
            }
            html += `<div class="${cls}" onclick="pick('${l}')"><b>${l}.</b> ${q.opts[i] || ''}</div>`;
        });

        if(state.mode === 'analysis') {
            const query = encodeURIComponent(`NCERT Solution for: ${q.txt}`);
            html += `
                <div class="ai-box">
                    <span class="ncert-hint">NCERT Reference & Solution</span>
                    <p style="font-size:0.9rem">Bhai, iska detailed solution check karne ke liye niche button dabao:</p>
                    <button class="btn btn-ai" onclick="window.open('https://www.google.com/search?q=${query}')">
                        🔍 Auto-Find Solution (Google AI)
                    </button>
                </div>
            `;
        }
        document.getElementById('q-content').innerHTML = html;
    }

    function pick(l) { if(state.mode === 'exam') { state.ans[state.idx] = l; renderQ(); } }
    function move(d) { state.idx = Math.max(0, Math.min(state.t.qs.length - 1, state.idx + d)); renderQ(); }

    function finish() {
        let c = 0, w = 0;
        state.t.qs.forEach((q, i) => {
            if(state.ans[i] === q.key) c++;
            else if(state.ans[i]) w++;
        });
        document.getElementById('quiz').style.display = 'none';
        const res = document.getElementById('result');
        res.style.display = 'block';
        res.innerHTML = `
            <div class="card" style="text-align:center">
                <h2>Score: ${(c*4)-w}</h2>
                <div class="btn-p" style="background:#000" onclick="state.mode='analysis'; state.idx=0; document.getElementById('result').style.display='none'; document.getElementById('quiz').style.display='block'; renderQ()">View Analysis with Auto-Solutions</div>
                <button class="btn" style="margin-top:10px" onclick="location.reload()">Back to Library</button>
            </div>
        `;
    }

    // --- SYNC LOGIC FOR OTHER PHONES ---
    function exportAll() {
        const code = btoa(unescape(encodeURIComponent(JSON.stringify(library))));
        const tempInput = document.createElement("input");
        document.body.appendChild(tempInput);
        tempInput.value = code;
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        alert("Sync Code copied! Ab dusre phone mein 'Import' button dabakar ye code paste kar do.");
    }

    function importTest() {
        const code = prompt("Paste Sync Code here:");
        if(code) {
            try {
                const imported = JSON.parse(decodeURIComponent(escape(atob(code))));
                library = imported;
                localStorage.setItem('genie_sync', JSON.stringify(library));
                location.reload();
            } catch(e) { alert("Invalid Code!"); }
        }
    }

    renderDash();
</script>
</body>
</html>
