<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie PRO | Advanced AI Portal</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --primary: #38bdf8;
            --accent: #818cf8; --text: #f1f5f9; --danger: #f43f5e; --success: #10b981;
            --glass: rgba(255, 255, 255, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
        
        nav { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); padding: 1rem 5%; display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        
        .container { max-width: 950px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: var(--card); border-radius: 1.2rem; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 1.5rem; animation: fadeIn 0.4s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .q-img { max-width: 100%; border-radius: 10px; margin-bottom: 1.5rem; display: block; border: 1px solid var(--glass); }
        .subject-badge { background: var(--primary); color: #000; padding: 2px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        
        .option { display: block; width: 100%; padding: 1.2rem; margin: 0.8rem 0; background: var(--glass); border: 2px solid transparent; border-radius: 12px; cursor: pointer; color: var(--text); text-align: left; font-size: 1rem; transition: 0.2s; }
        .option:hover { background: rgba(255,255,255,0.1); }
        .option.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.15); font-weight: 600; }
        
        .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 6px solid var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 1.5rem auto; }
        
        .report-table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: var(--glass); border-radius: 10px; overflow: hidden; }
        .report-table th, .report-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .report-table th { background: rgba(255,255,255,0.1); color: var(--primary); }

        .ai-btn { background: linear-gradient(45deg, #6366f1, #a855f7); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .explanation { background: rgba(0,0,0,0.3); padding: 1.2rem; border-radius: 12px; margin-top: 12px; border-left: 4px solid var(--accent); font-size: 0.95rem; display: none; white-space: pre-line; }
        
        .hidden { display: none !important; }
        .btn { padding: 0.8rem 1.8rem; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-retry { background: var(--success); color: white; margin-top: 10px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .weakness-box { background: rgba(244, 63, 94, 0.1); border: 1px dashed var(--danger); padding: 15px; border-radius: 12px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo" onclick="location.reload()">NEET<span>Genie AI</span></a>
    <div id="nav-timer" class="hidden" style="color: var(--danger); font-weight: 800; font-size: 1.3rem; font-family: monospace;">00:00</div>
</nav>

<div class="container">
    <section id="view-dashboard">
        <h2 style="margin-bottom: 1.5rem;">🎯 Live Test Series</h2>
        <div id="test-list" class="grid">Loading tests...</div>
    </section>

    <section id="view-quiz" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <div>
                    <span id="subject-tag" class="subject-badge">General</span>
                    <br><span id="q-number" style="font-weight: 600; opacity: 0.8;">Question 1</span>
                </div>
                <button class="btn btn-outline" style="padding: 5px 15px;" onclick="window.togglePause()" id="pause-btn">⏸ Pause</button>
            </div>
            
            <div id="quiz-main-content">
                <img id="q-image" class="q-img hidden" src="">
                <h3 id="q-text" style="font-size: 1.25rem; margin-bottom: 1.5rem;"></h3>
                <div id="options-container"></div>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 2rem;">
                <button class="btn btn-outline" onclick="window.nav(-1)">⬅ Prev</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="next-btn" onclick="window.nav(1)">Next ➡</button>
                    <button class="btn btn-danger hidden" id="submit-btn" onclick="window.completeTest()">🚀 Submit</button>
                </div>
            </div>
        </div>
    </section>

    <section id="view-result" class="hidden">
        <div class="card" style="text-align: center;">
            <h2>Test Analysis</h2>
            <div class="score-circle">
                <span class="score-val" id="res-score">0</span>
                <span id="res-accuracy" style="font-size: 0.8rem; color: var(--primary);">0% Accuracy</span>
            </div>

            <table class="report-table">
                <thead>
                    <tr><th>Subject</th><th>Score</th><th>C/W</th></tr>
                </thead>
                <tbody id="subject-report-body"></tbody>
            </table>

            <div class="weakness-box hidden" id="ai-weakness">
                <h4 style="color:var(--danger)">🔍 AI Weakness Analysis</h4>
                <p id="weakness-text" style="font-size: 0.9rem; margin-top: 5px;"></p>
            </div>

            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                <button id="retry-btn" class="btn btn-retry hidden" onclick="window.startRetry()">🔄 Retry Wrong Questions</button>
                <button class="btn btn-primary" onclick="location.reload()">Back to Dashboard</button>
            </div>
        </div>
        <div id="analysis-container"></div>
    </section>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1Xl8legdU-lIflwNVBl6sPs4OZags4eM",
        authDomain: "neet-genie.firebaseapp.com",
        projectId: "neet-genie",
        storageBucket: "neet-genie.firebasestorage.app",
        messagingSenderId: "91475548401",
        appId: "1:91475548401:web:f395534d6d806d52713150"
    };

    const GEMINI_KEY = "AIzaSyB1Xl8legdU-lIflwNVBl6sPs4OZags4eM";
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentTest = null;
    let answers = [];
    let qIdx = 0;
    let timer;
    let timeLeft = 0;
    let isPaused = false;
    let isRetryMode = false;

    // --- Subject Detection Logic ---
    const detectSubject = (text = "") => {
        const t = text.toLowerCase();
        if(/force|velocity|energy|mass|electric|field|circuit|wave|optics|thermal|logic|motion/.test(t)) return "Physics";
        if(/molar|reaction|bond|organic|compound|acid|base|atomic|element|gas|chemistry/.test(t)) return "Chemistry";
        if(/cell|dna|blood|plant|animal|human|organ|reproduction|genetics|evolution|bio/.test(t)) return "Biology";
        return "General";
    };

    // --- UI Helpers ---
    function show(id) {
        document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
        document.getElementById('view-' + id).classList.remove('hidden');
    }

    // --- Load Tests ---
    async function init() {
        const snap = await getDocs(collection(db, "tests"));
        const list = document.getElementById('test-list');
        list.innerHTML = "";
        snap.forEach(d => {
            const t = d.data();
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<h3>${t.testName}</h3><p>📋 ${t.questions.length} Questions</p><button class="btn btn-primary" style="width:100%;margin-top:10px">Start Test</button>`;
            div.onclick = () => startTest(d.id);
            list.appendChild(div);
        });
    }

    async function startTest(id) {
        const snap = await getDoc(doc(db, "tests", id));
        currentTest = snap.data();
        // Add subject to questions dynamically if missing
        currentTest.questions.forEach(q => q.subject = q.subject || detectSubject(q.question));
        
        answers = new Array(currentTest.questions.length).fill(null);
        timeLeft = currentTest.duration * 60;
        qIdx = 0; isRetryMode = false;
        show('quiz'); renderQ(); startTimer();
    }

    // --- Reattempt Feature ---
    window.startRetry = () => {
        const wrongIndices = currentTest.questions.map((q, i) => answers[i] !== q.answer ? i : null).filter(x => x !== null);
        const retryQuestions = wrongIndices.map(i => currentTest.questions[i]);
        
        currentTest = { ...currentTest, questions: retryQuestions, testName: "Retry Mode" };
        answers = new Array(retryQuestions.length).fill(null);
        qIdx = 0; isRetryMode = true;
        show('quiz'); renderQ();
    };

    function renderQ() {
        const q = currentTest.questions[qIdx];
        document.getElementById('subject-tag').innerText = q.subject;
        document.getElementById('q-number').innerText = `Question ${qIdx + 1}/${currentTest.questions.length}`;
        document.getElementById('q-text').innerText = q.question;
        
        const img = document.getElementById('q-image');
        if(q.imgUrl) { img.src = q.imgUrl; img.classList.remove('hidden'); }
        else { img.classList.add('hidden'); }

        const container = document.getElementById('options-container');
        container.innerHTML = "";
        ["A","B","C","D"].forEach((l, i) => {
            if(q.options[i]) {
                const btn = document.createElement('button');
                btn.className = `option ${answers[qIdx] === l ? 'selected' : ''}`;
                btn.innerHTML = `<b>${l}.</b> ${q.options[i]}`;
                btn.onclick = () => { if(!isPaused) { answers[qIdx] = l; renderQ(); } };
                container.appendChild(btn);
            }
        });

        document.getElementById('next-btn').classList.toggle('hidden', qIdx === currentTest.questions.length - 1);
        document.getElementById('submit-btn').classList.toggle('hidden', qIdx !== currentTest.questions.length - 1);
    }

    window.nav = (n) => { qIdx += n; renderQ(); };

    function startTimer() {
        const display = document.getElementById('nav-timer');
        display.classList.remove('hidden');
        timer = setInterval(() => {
            if(!isPaused) {
                timeLeft--;
                let m = Math.floor(timeLeft/60), s = timeLeft%60;
                display.innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(timeLeft <= 0) completeTest();
            }
        }, 1000);
    }

    window.togglePause = () => {
        isPaused = !isPaused;
        document.getElementById('pause-btn').innerText = isPaused ? "▶ Resume" : "⏸ Pause";
        document.getElementById('quiz-main-content').style.opacity = isPaused ? "0.1" : "1";
    };

    // --- Detailed Analytics Logic ---
    window.completeTest = () => {
        clearInterval(timer);
        let correct = 0, wrong = 0, skipped = 0;
        let stats = { Physics: {c:0, w:0}, Chemistry: {c:0, w:0}, Biology: {c:0, w:0}, General: {c:0, w:0} };

        currentTest.questions.forEach((q, i) => {
            const sub = q.subject;
            if(!answers[i]) { skipped++; }
            else if(answers[i] === q.answer) { correct++; stats[sub].c++; }
            else { wrong++; stats[sub].w++; }
        });

        show('result');
        const score = (correct * 4) - (wrong * 1);
        const accuracy = Math.round((correct / (correct + wrong || 1)) * 100);
        
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-accuracy').innerText = `${accuracy}% Accuracy`;
        
        // Subject Table
        const tbody = document.getElementById('subject-report-body');
        tbody.innerHTML = "";
        let weakAreas = [];
        for(let sub in stats) {
            if(stats[sub].c + stats[sub].w > 0) {
                const subScore = (stats[sub].c * 4) - (stats[sub].w * 1);
                tbody.innerHTML += `<tr><td>${sub}</td><td>${subScore}</td><td>${stats[sub].c}/${stats[sub].w}</td></tr>`;
                if(stats[sub].w > stats[sub].c) weakAreas.push(sub);
            }
        }

        // Weakness Analyzer
        const weaknessBox = document.getElementById('ai-weakness');
        if(weakAreas.length > 0) {
            weaknessBox.classList.remove('hidden');
            document.getElementById('weakness-text').innerText = `You are struggling in ${weakAreas.join(', ')}. Focus on these topics using NCERT and clear your basics.`;
        } else { weaknessBox.classList.add('hidden'); }

        document.getElementById('retry-btn').classList.toggle('hidden', (wrong + skipped === 0) || isRetryMode);
        renderAnalysis();
    };

    function renderAnalysis() {
        const container = document.getElementById('analysis-container');
        container.innerHTML = "<h3 style='margin: 2rem 0 1rem;'>Review Solutions</h3>";
        currentTest.questions.forEach((q, i) => {
            const isCorrect = answers[i] === q.answer;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="subject-badge">${q.subject}</div>
                <p><b>Q${i+1}:</b> ${q.question}</p>
                <p style="margin-top:10px;">Your Answer: <b style="color:${isCorrect?'var(--success)':'var(--danger)'}">${answers[i] || 'Skipped'}</b></p>
                <p>Correct Answer: <b style="color:var(--success)">${q.answer}</b></p>
                ${!isCorrect ? `<button class="ai-btn" onclick="window.explainAI(${i}, this)">✨ Subject-Wise AI Logic</button>` : ''}
                <div class="explanation" id="exp-${i}">Generating NEET-level analysis...</div>
            `;
            container.appendChild(card);
        });
    }

    // --- Enhanced Subject-Aware AI ---
    window.explainAI = async (idx, btn) => {
        const q = currentTest.questions[idx];
        const box = document.getElementById(`exp-${idx}`);
        box.style.display = "block"; btn.disabled = true;

        let subjectLogic = "";
        if(q.subject === "Physics") subjectLogic = "Focus on step-by-step formula application and numerical logic.";
        else if(q.subject === "Chemistry") subjectLogic = "Focus on reaction mechanism or chemical property logic based on NCERT.";
        else subjectLogic = "Focus on NCERT conceptual lines and biological definitions.";

        const prompt = `Task: NEET Expert Explanation.
        Subject: ${q.subject}
        Question: ${q.question}
        Options: A:${q.options[0]}, B:${q.options[1]}, C:${q.options[2]}, D:${q.options[3]}
        Correct Ans: ${q.answer}
        Style: ${subjectLogic}
        Keep it very short and exam-oriented.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            box.innerText = data.candidates[0].content.parts[0].text;
        } catch (e) { box.innerText = "Check your Gemini API key or quota."; }
    };

    window.onload = init;
</script>
</body>
</html>
