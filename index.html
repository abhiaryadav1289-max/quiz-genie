<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET GENIE – Local Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-sky { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

        // --- LOCAL STORAGE HELPERS ---
        const DB = {
            get: (key) => JSON.parse(localStorage.getItem(key)) || [],
            set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
            currentUser: () => JSON.parse(localStorage.getItem('ng_user')) || null
        };

        const App = () => {
            const [user, setUser] = useState(DB.currentUser());
            const [view, setView] = useState(user ? 'dashboard' : 'auth');
            const [currentTest, setCurrentTest] = useState(null);
            const [selectedResult, setSelectedResult] = useState(null);

            const logout = () => {
                localStorage.removeItem('ng_user');
                setUser(null);
                setView('auth');
            };

            return (
                <div className="min-h-screen">
                    {view === 'auth' ? (
                        <AuthView onLogin={(u) => { setUser(u); setView('dashboard'); }} />
                    ) : (
                        <div className="flex flex-col md:flex-row min-h-screen">
                            <nav className="w-full md:w-64 glass border-r border-white/5 p-6 flex flex-col gap-2">
                                <h1 className="text-2xl font-bold text-sky-400 mb-8">NEET GENIE</h1>
                                <button onClick={() => setView('dashboard')} className="p-3 text-left hover:bg-white/5 rounded-xl">🏠 Dashboard</button>
                                <button onClick={() => setView('leaderboard')} className="p-3 text-left hover:bg-white/5 rounded-xl">🏆 Leaderboard</button>
                                {user?.role === 'admin' && (
                                    <button onClick={() => setView('admin')} className="p-3 text-left bg-sky-500/10 text-sky-400 rounded-xl mt-4 font-bold">⚙️ Admin Panel</button>
                                )}
                                <button onClick={logout} className="mt-auto p-3 text-left text-red-400 hover:bg-red-500/10 rounded-xl">🚪 Logout</button>
                            </nav>

                            <main className="flex-1 p-6 md:p-10 overflow-y-auto custom-scroll">
                                {view === 'dashboard' && <Dashboard setView={setView} setCurrentTest={setCurrentTest} />}
                                {view === 'test' && <TestInterface user={user} test={currentTest} setView={setView} setResult={setSelectedResult} />}
                                {view === 'result' && <ResultView result={selectedResult} setView={setView} />}
                                {view === 'leaderboard' && <Leaderboard />}
                                {view === 'admin' && <AdminPanel />}
                            </main>
                        </div>
                    )}
                </div>
            );
        };

        const AuthView = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const handleLogin = (e) => {
                e.preventDefault();
                const role = email.includes('admin') ? 'admin' : 'user';
                const userObj = { email, name: email.split('@')[0], role };
                localStorage.setItem('ng_user', JSON.stringify(userObj));
                onLogin(userObj);
            };
            return (
                <div className="h-screen flex items-center justify-center p-4">
                    <div className="glass p-8 rounded-3xl w-full max-w-md shadow-2xl">
                        <h2 className="text-3xl font-bold text-center mb-8">Login to <span className="text-sky-400">Genie</span></h2>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="email" placeholder="Email (use 'admin' in email for Admin Access)" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-sky-500" required onChange={e => setEmail(e.target.value)} />
                            <input type="password" placeholder="Any Password" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-sky-500" required />
                            <button className="w-full gradient-sky text-white font-bold py-3 rounded-xl">Enter Portal</button>
                        </form>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ setView, setCurrentTest }) => {
            const tests = DB.get('ng_tests');
            return (
                <div className="animate-fade">
                    <h2 className="text-3xl font-bold mb-8">Available Tests</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {tests.map((t, i) => (
                            <div key={i} className="glass p-6 rounded-2xl border border-white/5 flex flex-col">
                                <h3 className="text-xl font-bold mb-2">{t.name}</h3>
                                <p className="text-slate-400 text-sm mb-6 flex-grow">{t.questions.length} Questions • {t.duration} Mins</p>
                                <button onClick={() => { setCurrentTest(t); setView('test'); }} className="gradient-sky py-2 rounded-xl font-bold">Start Now</button>
                            </div>
                        ))}
                        {tests.length === 0 && <p className="text-slate-500 italic">No tests found. Add some from Admin Panel.</p>}
                    </div>
                </div>
            );
        };

        const TestInterface = ({ user, test, setView, setResult }) => {
            const [qIdx, setQIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(test.duration * 60);

            useEffect(() => {
                const timer = setInterval(() => setTimeLeft(p => p > 0 ? p - 1 : 0), 1000);
                return () => clearInterval(timer);
            }, []);

            const finish = () => {
                let correct = 0, wrong = 0;
                test.questions.forEach(q => {
                    if (answers[q.id] === q.correct) correct++;
                    else if (answers[q.id] !== undefined) wrong++;
                });
                const score = Math.max(0, (correct * 4) - (wrong * 1));
                const res = { score, correct, wrong, testName: test.name, userName: user.name, date: new Date().toLocaleDateString() };
                
                const attempts = DB.get('ng_attempts');
                DB.set('ng_attempts', [...attempts, res]);
                setResult(res);
                setView('result');
            };

            const q = test.questions[qIdx];

            return (
                <div className="max-w-4xl mx-auto glass rounded-3xl overflow-hidden border border-white/10 flex flex-col">
                    <div className="bg-slate-900/50 p-4 flex justify-between items-center border-b border-white/5">
                        <span className="font-bold text-sky-400">{test.name}</span>
                        <span className="bg-sky-500 px-4 py-1 rounded-lg font-mono text-xl">{Math.floor(timeLeft/60)}:{String(timeLeft%60).padStart(2,'0')}</span>
                    </div>
                    <div className="p-8 flex-1">
                        <h3 className="text-xl mb-6">Q{qIdx+1}: {q.question}</h3>
                        <div className="space-y-3">
                            {q.options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [q.id]: i})} className={`w-full text-left p-4 rounded-xl border-2 transition-all ${answers[q.id] === i ? 'border-sky-500 bg-sky-500/10' : 'border-white/5 hover:border-white/20'}`}>
                                    {opt}
                                </button>
                            ))}
                        </div>
                    </div>
                    <div className="p-4 bg-slate-900/50 flex justify-between">
                        <button disabled={qIdx === 0} onClick={() => setQIdx(qIdx-1)} className="px-6 py-2 bg-slate-800 rounded-xl disabled:opacity-30">Back</button>
                        {qIdx === test.questions.length - 1 ? 
                            <button onClick={finish} className="gradient-sky px-8 py-2 rounded-xl font-bold">Finish Test</button> :
                            <button onClick={() => setQIdx(qIdx+1)} className="bg-sky-600 px-8 py-2 rounded-xl font-bold">Next</button>
                        }
                    </div>
                </div>
            );
        };

        const ResultView = ({ result, setView }) => (
            <div className="text-center animate-fade py-10">
                <h2 className="text-4xl font-bold mb-2 text-emerald-400">Score: {result.score}</h2>
                <p className="text-slate-400 mb-8">{result.testName} Completed Successfully</p>
                <div className="flex justify-center gap-4 mb-8">
                    <div className="glass p-4 rounded-xl w-32"><div className="text-emerald-400 font-bold">{result.correct}</div><div className="text-xs">Correct</div></div>
                    <div className="glass p-4 rounded-xl w-32"><div className="text-red-400 font-bold">{result.wrong}</div><div className="text-xs">Wrong</div></div>
                </div>
                <button onClick={() => setView('dashboard')} className="gradient-sky px-10 py-3 rounded-xl font-bold">Return Home</button>
            </div>
        );

        const Leaderboard = () => {
            const attempts = DB.get('ng_attempts').sort((a,b) => b.score - a.score).slice(0, 10);
            return (
                <div className="max-w-3xl mx-auto glass rounded-2xl overflow-hidden">
                    <table className="w-full text-left">
                        <thead className="bg-white/5 text-slate-400 text-xs font-bold uppercase">
                            <tr><th className="p-4">Rank</th><th className="p-4">User</th><th className="p-4">Test</th><th className="p-4">Score</th></tr>
                        </thead>
                        <tbody>
                            {attempts.map((a, i) => (
                                <tr key={i} className="border-t border-white/5">
                                    <td className="p-4 font-bold">#{i+1}</td>
                                    <td className="p-4">{a.userName}</td>
                                    <td className="p-4 text-slate-400">{a.testName}</td>
                                    <td className="p-4 text-sky-400 font-bold">{a.score}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        const AdminPanel = () => {
            const [name, setName] = useState('');
            const [json, setJson] = useState('');
            const [tests, setTests] = useState(DB.get('ng_tests'));

            const addTest = (e) => {
                e.preventDefault();
                try {
                    const qs = JSON.parse(json);
                    const newTests = [...tests, { name, duration: 180, questions: qs, id: Date.now() }];
                    DB.set('ng_tests', newTests);
                    setTests(newTests);
                    alert("Test Added to Phone Memory!");
                } catch(e) { alert("Invalid JSON format!"); }
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div className="glass p-6 rounded-3xl h-fit">
                        <h3 className="text-xl font-bold mb-4">Add Test (LocalStorage)</h3>
                        <form onSubmit={addTest} className="space-y-4">
                            <input placeholder="Test Name" className="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-sky-500" required onChange={e => setName(e.target.value)} />
                            <textarea rows="8" placeholder='[{"id":1,"question":"1+1?","options":["1","2","3","4"],"correct":1}]' className="w-full bg-white/5 border border-white/10 p-3 rounded-xl font-mono text-xs outline-none" required onChange={e => setJson(e.target.value)} />
                            <button className="w-full gradient-sky py-3 rounded-xl font-bold">Save to Device</button>
                        </form>
                    </div>
                    <div className="space-y-4">
                        <h3 className="text-xl font-bold">Manage Device Data</h3>
                        {tests.map((t, i) => (
                            <div key={i} className="glass p-4 rounded-xl flex justify-between items-center">
                                <span>{t.name}</span>
                                <button onClick={() => {
                                    const filtered = tests.filter(x => x.id !== t.id);
                                    DB.set('ng_tests', filtered);
                                    setTests(filtered);
                                }} className="text-red-400">Delete</button>
                            </div>
                        ))}
                        <button onClick={() => {localStorage.clear(); window.location.reload();}} className="w-full p-2 border border-red-500/30 text-red-400 rounded-xl mt-10">Clear All Data (Hard Reset)</button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
