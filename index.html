<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie 🩺 | Exam Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <style>
        :root { --p: #2563eb; --bg: #f8fafc; --border: #e2e8f0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; }

        /* Auth Card Styling (Ref: Login UI) */
        #auth-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 380px; padding: 40px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; border: 1px solid var(--border); }
        .tab-box { display: flex; gap: 20px; justify-content: center; margin-bottom: 25px; border-bottom: 1px solid #eee; }
        .tab { padding: 8px 12px; cursor: pointer; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--p); border-color: var(--p); }

        /* Sidebar Styling (Ref: Image 2619f312) */
        .sidebar { width: 260px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 30px 20px; }
        .nav-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; margin: 25px 0 10px 10px; font-weight: 700; }
        .nav-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; color: #475569; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .nav-item.active { background: #eff6ff; color: var(--p); }

        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 12px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; background: var(--p); color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1 style="color:var(--p); margin-bottom:20px;">Genie 🩺</h1>
            <div class="tab-box">
                <div id="tab-login" class="tab active" onclick="setMode('login')">Login</div>
                <div id="tab-signup" class="tab" onclick="setMode('signup')">New User</div>
                <div id="tab-admin" class="tab" onclick="setMode('admin')">Admin</div>
            </div>
            <p id="err-msg" style="color:red; font-size:0.8rem; margin-bottom:10px;"></p>
            <input type="text" id="in-name" class="input hidden" placeholder="Your Name">
            <input type="text" id="in-user" class="input" placeholder="Username">
            <input type="password" id="in-pass" class="input" placeholder="Password">
            <input type="password" id="in-conf" class="input hidden" placeholder="Confirm Password">
            <button class="btn" onclick="submitAuth()">Continue</button>
        </div>
    </div>

    <div class="sidebar">
        <h2 style="color:var(--p); margin-left:10px;">Genie 🩺</h2>
        <div class="nav-label">Student Portal</div>
        <div class="nav-item active">🏠 Dashboard</div>
        <div class="nav-item">📊 My Results</div>
        <div id="admin-menu" class="hidden">
            <div class="nav-label">Admin Panel</div>
            <div class="nav-item">⚙️ Manage Tests</div>
        </div>
        <button class="btn" style="margin-top:auto; background:#fee2e2; color:red;" onclick="auth.signOut()">Logout</button>
    </div>

    <div class="main">
        <h1 id="welcome-text">Welcome back!</h1>
        <div id="test-container" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:20px; margin-top:30px;">
            </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB1Yk3k4LgpPLBm0hp73tMYuDEDiJaRamM",
            authDomain: "neet-genie.firebaseapp.com",
            projectId: "neet-genie",
            storageBucket: "neet-genie.firebasestorage.app",
            messagingSenderId: "91475548401",
            appId: "1:91475548401:web:f395534d6d806d52713150"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let authMode = 'login';
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        function setMode(m) {
            authMode = m;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+m).classList.add('active');
            document.getElementById('in-name').classList.toggle('hidden', m !== 'signup');
            document.getElementById('in-conf').classList.toggle('hidden', m !== 'signup');
        }

        async function submitAuth() {
            const user = document.getElementById('in-user').value.trim().toLowerCase();
            const pass = document.getElementById('in-pass').value;
            const name = document.getElementById('in-name').value;
            const conf = document.getElementById('in-conf').value;
            const err = document.getElementById('err-msg');

            if(!user || !pass) { err.innerText = "Fill all fields!"; return; }

            try {
                const email = user + "@genie.com";
                if(authMode === 'signup') {
                    if(pass !== conf) { err.innerText = "Password mismatch!"; return; }
                    const check = await db.collection("usernames").doc(user).get();
                    if(check.exists) { err.innerText = "Username taken!"; return; }
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.collection("users").doc(res.user.uid).set({ name, username: user, role: 'student' });
                    await db.collection("usernames").doc(user).set({ uid: res.user.uid });
                } else {
                    await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch (e) { err.innerText = e.message; }
        }

        auth.onAuthStateChanged(async (u) => {
            const screen = document.getElementById('auth-screen');
            if(u) {
                const doc = await db.collection("users").doc(u.uid).get();
                const data = doc.data();
                screen.classList.add('hidden');
                document.getElementById('welcome-text').innerText = "Hello, " + (data ? data.name : "Doctor") + "!";
                if(data && data.role === 'admin') document.getElementById('admin-menu').classList.remove('hidden');
            } else {
                screen.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
