<div id="admin-controls" class="card hidden">
    <h3>🛠️ Admin: Smart Bulk Upload</h3>
    <input type="text" id="t-name" placeholder="Test Name (e.g., Full Bio Mock)">
    <input type="number" id="t-mins" placeholder="Duration (Minutes)">
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
        <div>
            <label style="font-size: 0.8rem; font-weight: bold;">Paste Questions Block:</label>
            <textarea id="t-qs-block" rows="10" placeholder="Q1. What is cell? A) x B) y C) z D) w..."></textarea>
        </div>
        <div>
            <label style="font-size: 0.8rem; font-weight: bold;">Paste Answer Key Block:</label>
            <textarea id="t-ans-block" rows="10" placeholder="1. A, 2. B, 3. C..."></textarea>
        </div>
    </div>
    
    <button class="btn btn-p" style="width:100%" onclick="processSmartUpload()">🚀 Smart Detect & Upload</button>
</div>

<script>
    // --- SMART UPLOAD LOGIC ---
    async function processSmartUpload() {
        const name = document.getElementById('t-name').value;
        const mins = document.getElementById('t-mins').value;
        const qBlock = document.getElementById('t-qs-block').value;
        const aBlock = document.getElementById('t-ans-block').value;

        if(!name || !qBlock || !aBlock) {
            alert("Bhai, sari details fill karo!");
            return;
        }

        try {
            // 1. Extract Questions: Splits by Q followed by number (Q1, Q2, 1., 2.)
            const qRegex = /(?:Q?\d+[\.\)\s]+)(.*?)(?=(?:Q?\d+[\.\)\s]+)|$)/gs;
            const questionsFound = [...qBlock.matchAll(qRegex)];

            // 2. Extract Answers: Finds patterns like 1. A or 1-A or (1) A
            const ansRegex = /(?:\d+[\.\)\-\s]+)([A-D])/gi;
            const answersFound = [...aBlock.matchAll(ansRegex)].map(m => m[1].toUpperCase());

            const finalQuestions = questionsFound.map((match, i) => {
                const fullText = match[1].trim();
                // Logic to separate Question Text from Options (A, B, C, D)
                const parts = fullText.split(/[A-D][\)\.\s]+/);
                const questionText = parts[0].trim();
                const options = parts.slice(1, 5).map(opt => opt.trim());

                return {
                    txt: questionText,
                    opts: options.length === 4 ? options : ["Opt A", "Opt B", "Opt C", "Opt D"],
                    key: answersFound[i] || "A" // Matches by index
                };
            });

            if(finalQuestions.length === 0) throw new Error("No questions detected.");

            // 3. Upload to Firestore
            await db.collection("global_tests").add({
                name,
                mins: parseInt(mins),
                qs: finalQuestions,
                createdAt: new Date(),
                totalQs: finalQuestions.length
            });

            alert(`Success! ${finalQuestions.length} questions detected and uploaded.`);
            location.reload();

        } catch (e) {
            console.error(e);
            alert("Error: Pattern match nahi hua. Please check the format.");
        }
    }

    // --- UPDATED AUTH STATE ---
    auth.onAuthStateChanged(async (user) => {
        if(user) {
            const doc = await db.collection("usernames").doc(user.uid).get();
            currentUserData = doc.data();
            
            // UI Switch
            document.getElementById('v-auth').classList.add('hidden');
            document.getElementById('v-dash').classList.remove('hidden');
            document.getElementById('user-display').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-display').innerText = `Hye ${currentUserData.username}`;
            
            // ADMIN PANEL ONLY SHOWS IF ROLE IS ADMIN
            if(currentUserData.role === 'admin') {
                document.getElementById('admin-controls').classList.remove('hidden');
            } else {
                document.getElementById('admin-controls').classList.add('hidden');
            }
            fetchTests();
        } else {
            document.getElementById('v-auth').classList.remove('hidden');
            document.getElementById('v-dash').classList.add('hidden');
            document.getElementById('admin-controls').classList.add('hidden'); // Force hide on logout
        }
    });
</script>
