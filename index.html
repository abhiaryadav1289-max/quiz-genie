<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie Ultra - Pro Mode</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg: #0b0f1a; --card: #161b22; --accent: #58a6ff; --text: #c9d1d9; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: auto; }
        .card { background: var(--card); border: 1px solid #30363d; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: var(--accent); border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        textarea, input, select { width: 100%; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin: 10px 0; box-sizing: border-box; }
        .btn { background: #238636; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
        .btn:hover { background: #2ea043; }
        #timerDisplay { font-size: 3rem; text-align: center; color: #ff7b72; font-family: 'Courier New', monospace; margin: 20px 0; border: 2px solid #30363d; border-radius: 10px; padding: 10px; }
        .question-text { font-size: 1.3rem; line-height: 1.6; color: #adbac7; background: #22272e; padding: 20px; border-radius: 8px; border-left: 5px solid var(--accent); }
        .nav-btns { display: flex; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="setupArea" class="card">
        <h2>🚀 NEET Genie: Test Setup</h2>
        <input type="text" id="testTitle" placeholder="Batch Name (e.g. Organic Chem Pankaj Sir)">
        
        <p>Questions & Answers (Paste everything here):</p>
        <textarea id="bulkInput" rows="8" placeholder="Question 1...&#10;Question 2..."></textarea>
        
        <div style="display:flex; gap:15px; align-items: center;">
            <label>Set Timer (Minutes):</label>
            <input type="number" id="timeLimit" value="45" style="width: 100px;">
        </div>
        
        <button class="btn" onclick="initializeTest()">Start Practice Now 🏁</button>
    </div>

    <div id="quizArea" class="card" style="display:none;">
        <div id="timerDisplay">00:00</div>
        <div id="activeTestName" style="text-align:center; color:#8b949e; margin-bottom:10px;"></div>
        <div id="questionDisplay" class="question-text"></div>
        <input type="text" id="answerInput" placeholder="Write your answer / option here...">
        
        <div class="nav-btns">
            <button class="btn" onclick="handleNext()" style="background:#1f6feb;">Next Question ➡️</button>
            <button class="btn" onclick="finishTest()" style="background:#da3633;">Finish Test</button>
        </div>
    </div>
</div>

<script>
    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyB1Yk3k4LgpPLBm0hp73tMYuDEDiJaRamM",
        authDomain: "neet-genie.firebaseapp.com",
        projectId: "neet-genie",
        storageBucket: "neet-genie.firebasestorage.app",
        messagingSenderId: "91475548401",
        appId: "1:91475548401:web:f395534d6d806d52713150"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let questions = [];
    let currentIndex = 0;
    let timerRef;

    async function initializeTest() {
        const title = document.getElementById('testTitle').value;
        const rawData = document.getElementById('bulkInput').value.trim();
        const mins = document.getElementById('timeLimit').value;

        if(!title || !rawData) {
            alert("Bhai, pehle details toh dalo!");
            return;
        }

        questions = rawData.split('\n').filter(line => line.trim() !== "");
        currentIndex = 0;

        // Cloud Pe Backup
        await db.collection("tests_v2").add({
            testName: title,
            totalQ: questions.length,
            timeSet: mins,
            timestamp: new Date()
        });

        // UI Change
        document.getElementById('setupArea').style.display = "none";
        document.getElementById('quizArea').style.display = "block";
        document.getElementById('activeTestName').innerText = "Topic: " + title;

        startQuizTimer(mins * 60);
        showNextQuestion();
    }

    function showNextQuestion() {
        if(currentIndex < questions.length) {
            document.getElementById('questionDisplay').innerText = `Q${currentIndex + 1}: ${questions[currentIndex]}`;
            document.getElementById('answerInput').value = "";
        } else {
            finishTest();
        }
    }

    function handleNext() {
        currentIndex++;
        showNextQuestion();
    }

    function startQuizTimer(duration) {
        let timer = duration, minutes, seconds;
        timerRef = setInterval(function () {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            document.getElementById('timerDisplay').textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(timerRef);
                alert("Time Over!");
                finishTest();
            }
        }, 1000);
    }

    function finishTest() {
        clearInterval(timerRef);
        alert("Test Complete! Aapka data cloud par sync ho gaya hai.");
        location.reload();
    }
</script>
</body>
</html>
