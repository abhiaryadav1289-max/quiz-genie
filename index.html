<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie 🩺 | Exam Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <style>
        :root { --p: #2563eb; --bg: #f1f5f9; --border: #e2e8f0; --d: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; min-height: 100vh; }

        /* AUTH SCREEN */
        #auth-overlay { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; }
        .auth-card { width: 100%; max-width: 400px; padding: 40px; text-align: center; border-radius: 24px; background: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .tab-btn { padding: 10px 15px; cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; display: inline-block; margin-bottom: 20px; color: #64748b; }
        .tab-btn.active { color: var(--p); border-color: var(--p); }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1.5px solid var(--border); border-radius: 12px; outline: none; box-sizing: border-box; font-size: 1rem; }
        
        /* SIDEBAR & CONTENT */
        .sidebar { width: 280px; background: #fff; border-right: 1px solid var(--border); padding: 40px 24px; position: fixed; height: 100vh; display: none; }
        .main-content { margin-left: 280px; flex: 1; padding: 40px; display: none; }
        .btn { padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; font-size: 1rem; }
        .btn-p { background: var(--p); color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h1 style="color:var(--p); margin-top:0;">Genie 🩺</h1>
            
            <div style="margin-bottom: 10px; border-bottom: 1px solid #eee;">
                <span id="t-login" class="tab-btn active" onclick="setMode('login')">Login</span>
                <span id="t-signup" class="tab-btn" onclick="setMode('signup')">New Account</span>
                <span id="t-admin" class="tab-btn" onclick="setMode('admin')">Admin Panel</span>
            </div>

            <div id="auth-msg" style="color:red; margin-bottom:15px; font-size:0.85rem; font-weight: 600;"></div>

            <input type="text" id="inp-name" class="auth-input hidden" placeholder="Your Full Name">
            <input type="text" id="inp-user" class="auth-input" placeholder="Username (e.g. abhi123)">
            <input type="password" id="inp-pass" class="auth-input" placeholder="Password">
            <input type="password" id="inp-conf" class="auth-input hidden" placeholder="Confirm Password">
            
            <button id="auth-btn" class="btn btn-p" onclick="handleAuth()">Login</button>
            <p id="mode-text" style="font-size: 0.8rem; color: #64748b; margin-top: 15px;">Login using your username & password</p>
        </div>
    </div>

    <nav class="sidebar" id="sidebar">
        <h2 style="color:var(--p); text-align:center;">Genie 🩺</h2>
        <div style="margin-top:40px;">
            <p style="color:#94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;">Student Portal</p>
            <p id="display-user" style="font-weight:800; font-size:1.1rem; color:var(--p); margin-bottom: 20px;"></p>
            <p onclick="location.reload()" style="cursor:pointer; font-weight:600;">🏠 Dashboard</p>
        </div>
        <button class="btn" style="position:absolute; bottom:30px; background:#fee2e2; color:red; width: calc(100% - 48px);" onclick="auth.signOut()">Logout</button>
    </nav>

    <main class="main-content" id="main-content">
        <h1 id="view-title">Welcome to NEET Portal</h1>
        <div id="content-area">Dashboard and Tests will load here...</div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB1Yk3k4LgpPLBm0hp73tMYuDEDiJaRamM",
            authDomain: "neet-genie.firebaseapp.com",
            projectId: "neet-genie",
            storageBucket: "neet-genie.firebasestorage.app",
            messagingSenderId: "91475548401",
            appId: "1:91475548401:web:f395534d6d806d52713150"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentMode = 'login';
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.getElementById('t-' + mode).classList.add('active');
            document.getElementById('auth-msg').innerText = '';

            // Toggle Input Visibility
            document.getElementById('inp-name').classList.toggle('hidden', mode !== 'signup');
            document.getElementById('inp-conf').classList.toggle('hidden', mode !== 'signup');
            
            if(mode === 'admin') {
                document.getElementById('auth-btn').innerText = 'Admin Login';
                document.getElementById('mode-text').innerText = 'Access for Teachers/Admins only';
            } else if(mode === 'signup') {
                document.getElementById('auth-btn').innerText = 'Create My Account';
                document.getElementById('mode-text').innerText = 'Create your unique username to start';
            } else {
                document.getElementById('auth-btn').innerText = 'Login';
                document.getElementById('mode-text').innerText = 'Login using your username & password';
            }
        }

        async function handleAuth() {
            const name = document.getElementById('inp-name').value;
            const user = document.getElementById('inp-user').value.trim().toLowerCase();
            const pass = document.getElementById('inp-pass').value;
            const conf = document.getElementById('inp-conf').value;
            const msg = document.getElementById('auth-msg');

            if(!user || !pass) { msg.innerText = "Fill all details!"; return; }

            try {
                if(currentMode === 'signup') {
                    if(pass !== conf) { msg.innerText = "Passwords do not match!"; return; }
                    // 1. Check if Username exists
                    const check = await db.collection("usernames").doc(user).get();
                    if(check.exists) { msg.innerText = "Username already taken!"; return; }
                    
                    // 2. Create Auth (Using dummy email for Firebase)
                    const email = user + "@genie.com";
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    
                    // 3. Save User Data
                    await db.collection("users").doc(res.user.uid).set({ name, username: user, role: 'student' });
                    await db.collection("usernames").doc(user).set({ uid: res.user.uid });
                } else {
                    // Login Mode (Student or Admin)
                    const email = user + "@genie.com";
                    await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch (e) { 
                if(e.code === 'auth/configuration-not-found') {
                    msg.innerText = "Fix: Enable Email/Password in Firebase Console!";
                } else {
                    msg.innerText = "Error: " + e.message;
                }
            }
        }

        auth.onAuthStateChanged(async (u) => {
            if (u) {
                const doc = await db.collection("users").doc(u.uid).get();
                const data = doc.data();
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('sidebar').style.display = 'block';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('display-user').innerText = "@" + (data ? data.username : "user");
                
                // If admin, show admin view automatically
                if(data && data.role === 'admin') {
                    document.getElementById('view-title').innerText = "Admin Dashboard";
                }
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
