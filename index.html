<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Genie 🩺</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <style>
        :root { --p: #2563eb; --s: #10b981; --d: #ef4444; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; }
        .hidden { display: none !important; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: #fff; border-right: 1px solid #e2e8f0; padding: 30px 20px; display: flex; flex-direction: column; }
        .nav-item { padding: 12px; border-radius: 10px; cursor: pointer; margin-bottom: 5px; font-weight: 500; color: #64748b; }
        .nav-item.active { background: #eff6ff; color: var(--p); }

        /* Main Content */
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background: #fff; padding: 25px; border-radius: 15px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        
        /* Admin Form */
        textarea { width: 100%; height: 100px; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: #fff; transition: 0.3s; }
        .btn-p { background: var(--p); }
        .btn-d { background: var(--d); }

        /* Auth Overlay */
        #auth-overlay { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 350px; text-align: center; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h1 style="color:var(--p)">Genie 🩺</h1>
            <div id="auth-msg" style="color:red; margin-bottom:10px;"></div>
            <input type="text" id="log-user" placeholder="Username" style="width:100%; padding:12px; margin-bottom:10px;">
            <input type="password" id="log-pass" placeholder="Password" style="width:100%; padding:12px; margin-bottom:10px;">
            <button class="btn btn-p" style="width:100%;" onclick="handleLogin()">Login</button>
            <p style="font-size:0.8rem; margin-top:15px; cursor:pointer;" onclick="alert('Contact Admin for Account')">New User? Register via Admin</p>
        </div>
    </div>

    <div class="sidebar">
        <h2>Genie 🩺</h2>
        <div id="menu-student">
            <div class="nav-item active" onclick="showPage('student-dash')">🏠 Dashboard</div>
            <div class="nav-item" onclick="showPage('results')">📊 My Results</div>
        </div>
        <div id="menu-admin" class="hidden">
            <hr>
            <div class="nav-item" onclick="showPage('admin-upload')">📤 Upload Test</div>
            <div class="nav-item" onclick="showPage('admin-manage')">⚙️ Manage Tests</div>
        </div>
        <button class="btn btn-d" style="margin-top:auto;" onclick="auth.signOut()">Logout</button>
    </div>

    <div class="main">
        <div id="student-dash" class="page">
            <h1>Available Tests 📝</h1>
            <div id="test-list">Loading tests...</div>
        </div>

        <div id="admin-upload" class="page hidden">
            <h1>Upload New Test 📤</h1>
            <div class="card">
                <input type="text" id="test-name" placeholder="Test Name (e.g. Biology Full Mock)" style="width:100%; padding:10px; margin-bottom:10px;">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="number" id="test-hr" placeholder="Hrs" style="width:60px; padding:10px;">
                    <input type="number" id="test-min" placeholder="Min" style="width:60px; padding:10px;">
                </div>
                <label>Questions (Bulk Paste Format: Q|A|B|C|D|CorrectAnswer)</label>
                <textarea id="test-data" placeholder="What is cell?|Mitochondria|Nucleus|Ribosome|Golgi|A"></textarea>
                <button class="btn btn-p" onclick="saveTest()">Save & Publish Test</button>
            </div>
        </div>

        <div id="admin-manage" class="page hidden">
            <h1>Manage Existing Tests ⚙️</h1>
            <div id="manage-list"></div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG (Use yours)
        const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 🟢 AUTH LOGIC
        async function handleLogin() {
            const user = document.getElementById('log-user').value.toLowerCase();
            const pass = document.getElementById('log-pass').value;
            try {
                await auth.signInWithEmailAndPassword(user + "@genie.com", pass);
            } catch (e) { document.getElementById('auth-msg').innerText = "Invalid Credentials"; }
        }

        auth.onAuthStateChanged(async (u) => {
            if(u) {
                const doc = await db.collection("usernames").doc(u.uid).get();
                const data = doc.data();
                document.getElementById('auth-overlay').classList.add('hidden');
                if(data && data.role === 'admin') {
                    document.getElementById('menu-admin').classList.remove('hidden');
                }
                loadTests();
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
            }
        });

        // 🔵 ADMIN: SAVE TEST
        async function saveTest() {
            const name = document.getElementById('test-name').value;
            const hr = document.getElementById('test-hr').value;
            const min = document.getElementById('test-min').value;
            const rawData = document.getElementById('test-data').value;

            if(!name || !rawData) return alert("Fields missing!");

            const questions = rawData.split('\n').map(line => {
                const [q, a, b, c, d, ans] = line.split('|');
                return { q, options: [a,b,c,d], correct: ans };
            });

            await db.collection("global_tests").add({
                name, time: (parseInt(hr)*60) + parseInt(min),
                questions, createdAt: new Date()
            });
            alert("Test Saved Successfully!");
            location.reload();
        }

        // 🟡 LOAD TESTS (Student & Admin)
        async function loadTests() {
            const snap = await db.collection("global_tests").get();
            let html = '', manageHtml = '';
            snap.forEach(doc => {
                const t = doc.data();
                html += `<div class="card" style="display:flex; justify-content:space-between;">
                    <span><b>${t.name}</b> (${t.time} mins)</span>
                    <button class="btn btn-p" onclick="startQuiz('${doc.id}')">Start Test</button>
                </div>`;
                manageHtml += `<div class="card" style="display:flex; justify-content:space-between; border-left: 5px solid red;">
                    <span>${t.name}</span>
                    <button class="btn btn-d" onclick="deleteTest('${doc.id}')">Delete</button>
                </div>`;
            });
            document.getElementById('test-list').innerHTML = html;
            document.getElementById('manage-list').innerHTML = manageHtml;
        }

        async function deleteTest(id) {
            if(confirm("Delete this test?")) {
                await db.collection("global_tests").doc(id).delete();
                loadTests();
            }
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
