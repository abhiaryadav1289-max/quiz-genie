<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Genie</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>
body{
  background:#0a0f1e;
  color:#ffffff;
  font-family:sans-serif;
  padding:20px;
}
h1{
  text-align:center;
  color:#00d4ff;
}
.card{
  background:#141e35;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
}
button{
  padding:10px;
  margin:5px;
  background:#00d4ff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.option{
  display:block;
  width:100%;
  margin:8px 0;
  padding:10px;
  background:#222;
  border:1px solid #555;
  color:white;
}
</style></head><body><h1>📄 Quiz Genie</h1><div class="card">
<input type="file" id="pdfFile">
<br><br>
<button onclick="generateQuiz()">Generate Quiz</button>
</div><div id="quiz"></div>
<div id="result"></div><script>

let questions = [];
let answers = [];
let current = 0;

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// 📄 Read PDF
async function readPDF(file){
    const reader = new FileReader();
    reader.readAsArrayBuffer(file);

    return new Promise(resolve=>{
        reader.onload = async function(){
            let pdf = await pdfjsLib.getDocument({data:new Uint8Array(reader.result)}).promise;
            let text = "";

            for(let i=1;i<=pdf.numPages;i++){
                let page = await pdf.getPage(i);
                let content = await page.getTextContent();
                text += content.items.map(i=>i.str).join(" ") + "\\n";
            }

            resolve(text);
        }
    });
}

// 🔥 Convert PDF text → Questions
function parseQuestions(text){
    let blocks = text.split(/Q\\d+\\./i).slice(1);
    let result = [];

    blocks.forEach(b=>{
        let parts = b.split(/A\\)|B\\)|C\\)|D\\)/);

        if(parts.length>=5){
            result.push({
                question: parts[0].trim(),
                options:[
                    "A) "+parts[1].trim(),
                    "B) "+parts[2].trim(),
                    "C) "+parts[3].trim(),
                    "D) "+parts[4].trim()
                ],
                correct: ["A","B","C","D"][Math.floor(Math.random()*4)]
            });
        }
    });

    return result;
}

// 🚀 Generate Quiz
async function generateQuiz(){
    let file = document.getElementById("pdfFile").files[0];
    if(!file){
        alert("PDF upload karo");
        return;
    }

    let text = await readPDF(file);
    questions = parseQuestions(text);
    answers = new Array(questions.length).fill(null);
    current = 0;

    showQuestion();
}

// 📌 Show Question
function showQuestion(){
    let q = questions[current];
    let html = "<h3>Q"+(current+1)+": "+q.question+"</h3>";

    q.options.forEach((opt,i)=>{
        let label = ["A","B","C","D"][i];
        html += "<button class='option' onclick=\\"select('"+label+"')\\">"+opt+"</button>";
    });

    html += "<br><button onclick='next()'>Next</button>";
    document.getElementById("quiz").innerHTML = html;
}

// ✔️ Select Answer
function select(ans){
    answers[current] = ans;
}

// ➡️ Next Question
function next(){
    current++;
    if(current < questions.length){
        showQuestion();
    } else {
        showResult();
    }
}

// 📊 Result
function showResult(){
    let score = 0;
    let correct = 0;
    let wrong = 0;

    questions.forEach((q,i)=>{
        if(answers[i] == q.correct){
            score += 4;
            correct++;
        } else if(answers[i]){
            score -= 5;
            wrong++;
        }
    });

    document.getElementById("result").innerHTML =
        "<h2>Score: "+score+"</h2>"+
        "<p>Correct: "+correct+"</p>"+
        "<p>Wrong: "+wrong+"</p>";
}

</script></body>
</html>
